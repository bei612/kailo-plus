# BFF 请求与回应的类型、BFF 客户端与平台页取自 client-kit/ts（ADR-02/03、ADR-09），以 npm
# file: 依赖引用；Desktop 用的是同一份。它们在 inputs 里，改了即要求重建。
artifacts:
  # 构建上下文是 apps/：Dockerfile 在 web/ 下，同时放入 client-kit/ts（见同名 .dockerignore）。
  - name: web-client
    kind: image
    build_context: .
    build_dockerfile: web-client/web/Dockerfile
    inputs: [web-client/web/, client-kit/ts/contracts/, client-kit/ts/platform/]
