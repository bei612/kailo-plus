# Kailo entry topology (DD-164(10), .design/07 §4.6): browsers reach the native UI
# origin only through the Kailo gateway's component listener, which forwards to the
# alias below on the existing platform edge network. Added by start.sh only when
# KNOWLEDGE_EDGE_NETWORK is set; the UI port itself is published on loopback only.
services:
  frontend:
    networks:
      kailo-edge:
        aliases: [kailo-edge-knowledge]

networks:
  kailo-edge:
    external: true
    name: ${KNOWLEDGE_EDGE_NETWORK:?existing platform edge network required}
