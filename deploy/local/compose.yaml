# 本地开发拓扑（ADR-04）。它不复刻生产，但不简化网络边界——
# 07-运行与运维基线.md §2 明写「本地可以简化副本数与持久化，不可以简化边界」。
#
# 四层 network 的可达关系在此显式声明，默认不可达。任何服务加入新 network
# 视同边界变更，按 AGENTS.md 评审。本文件只含 Stage 0 已接入的服务；
# 上游组件随各自 Stage 加入，届时一并声明其 network 归属。

name: platform-local

networks:
  edge:       # 仅公开入口可达
  app:        # Core/BFF、Worker、Web 静态服务
  mgmt:       # 管理面与 admin router
  component:  # 各上游组件 runtime
  # 私有数据网络（DD-93）：每个数据库、缓存与对象存储只接入其所有者的 `<owner>-data`，
  # 只有名为 `<owner>` 或 `<owner>-*` 的服务可以加入；共享的 app/component 网络上
  # 不出现任何数据存储，其他服务在网络层就到不了别人的数据。
  core-data:
  temporal-data:
  buzz-data:
  spicedb-data:
  agentgateway-data:
  openmeter-data:

volumes:
  core-db-data:
  buzz-db-data:
  temporal-db-data:
  spicedb-db-data:
  agentgateway-db-data:
  agentgateway-provider-secrets:
  keycloak-data:
  openmeter-postgres-data:
  openmeter-kafka-data:
  openmeter-kafka-secrets:
  openmeter-clickhouse-data:
  openmeter-clickhouse-logs:
  openmeter-dedupe-data:

services:
  core-db:
    # 按 digest 引用，不使用可变 tag（ADR-06）。tag 16-alpine 只作人类可读别名。
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # 只在 core-data：只有 Core 自身可达；Worker 不直写 Core 数据库（01 §4），
    # 迁移从宿主经下方回环端口进行。
    networks: [core-data]
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:?必须显式提供，禁止硬编码}
      POSTGRES_USER: ${CORE_DB_USER:?必须显式提供，禁止硬编码}
      POSTGRES_PASSWORD_FILE: /run/secrets/core_db_password
    secrets: [core_db_password]
    volumes:
      - core-db-data:/var/lib/postgresql/data
    ports:
      # 仅绑定回环，供本机迁移演练与 psql 使用；不暴露到宿主网络之外。
      - "127.0.0.1:${CORE_DB_PORT:?必须显式提供，禁止硬编码}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  otel-collector:
    # 按 digest 引用（ADR-06）。别名 tag 为 0.139.0。
    image: otel/opentelemetry-collector-contrib@sha256:faf125d656fa47cea568b2f3b4494efd2525083bc75c1e96038bc23f05cd68fd
    # 应用侧只依赖 OTLP（ADR-05）。Stage 0/1 只跑 Collector 并导出到
    # 控制台与本地文件；Prometheus/Loki/Tempo 在 Stage 2 出现跨服务链路时接入。
    networks: [app, mgmt]
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otel_config
        target: /etc/otelcol/config.yaml

  # Temporal 是独立的 Workflow 权威，存储与 Core 分离——不共用实例也不共用凭据。
  temporal-db:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    networks: [temporal-data]
    environment:
      POSTGRES_DB: ${TEMPORAL_DB_NAME:?必须显式提供，禁止硬编码}
      POSTGRES_USER: ${TEMPORAL_DB_USER:?必须显式提供，禁止硬编码}
      POSTGRES_PASSWORD_FILE: /run/secrets/temporal_db_password
    secrets: [temporal_db_password]
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # schema 由 admin-tools 显式建立，不用 auto-setup 便利镜像：
  # 后者把建库与启动耦合在一起，生产上不可用，本地用它会让两边拓扑分叉。
  temporal-schema:
    image: temporalio/admin-tools@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    networks: [temporal-data]
    depends_on:
      temporal-db: { condition: service_healthy }
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: temporal-db
      SQL_PORT: "5432"
      SQL_USER: ${TEMPORAL_DB_USER:?必须显式提供，禁止硬编码}
      SQL_DATABASE: ${TEMPORAL_DB_NAME:?必须显式提供，禁止硬编码}
      VISIBILITY_DATABASE: ${TEMPORAL_DB_NAME:?必须显式提供，禁止硬编码}_visibility
      SQL_PASSWORD_FILE: /run/secrets/temporal_db_password
    secrets: [temporal_db_password]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export SQL_PASSWORD="$$(cat /run/secrets/temporal_db_password)"
        temporal-sql-tool --database "$$SQL_DATABASE" create-database || true
        temporal-sql-tool setup-schema -v 0.0
        temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        SQL_DATABASE="$$VISIBILITY_DATABASE" temporal-sql-tool --database "$$VISIBILITY_DATABASE" create-database || true
        SQL_DATABASE="$$VISIBILITY_DATABASE" temporal-sql-tool setup-schema -v 0.0
        SQL_DATABASE="$$VISIBILITY_DATABASE" temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
    restart: "no"

  temporal:
    image: temporalio/server@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae
    # component 网络：Core 与 Worker 经 app<->component 的显式连接到达它；
    # 它不接入 edge，Browser 永远无法直达（01 §8）。
    networks: [component, app, temporal-data]
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER:?必须显式提供，禁止硬编码}
      TEMPORAL_ENVIRONMENT: local
      TEMPORAL_DB_NAME: ${TEMPORAL_DB_NAME:?必须显式提供，禁止硬编码}
      TEMPORAL_VISIBILITY_DB_NAME: ${TEMPORAL_DB_NAME:?必须显式提供，禁止硬编码}_visibility
      OIDC_JWKS_URI: ${OIDC_ISSUER:?必须显式提供，禁止硬编码}/protocol/openid-connect/certs
    secrets: [temporal_db_password]
    configs:
      - source: temporal_dynamic_config
        target: /etc/temporal/config/dynamicconfig/local.yaml
      - source: temporal_config
        target: /etc/temporal/config/docker.yaml
    # 口令从 secret 挂载读入后导出，不进 .env、不进配置文件、不上命令行。
    # authorizer 与 claimMapper 在配置文件里显式设为 default（07 §1、SF-TMP-09）。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export POSTGRES_PWD="$$(cat /run/secrets/temporal_db_password)"
        export BIND_ON_IP=0.0.0.0
        export TEMPORAL_BROADCAST_ADDRESS="$$(getent hosts "$$(hostname)" | awk '{print $$1; exit}')"
        # internal-frontend 必须显式列入启动服务：配置里定义它只是声明，
        # temporal-server start 默认只起 frontend/history/matching/worker。
        exec temporal-server --env docker start \
          --service=frontend --service=internal-frontend \
          --service=history --service=matching --service=worker
    ports:
      # 仅绑回环，供本机连通性验证与 Worker 联调；不暴露到宿主网络之外。
      - "127.0.0.1:${TEMPORAL_FRONTEND_PORT:?必须显式提供，禁止硬编码}:7233"
    healthcheck:
      # server 镜像不含 temporal CLI 与 grpc_health_probe，只有 nc；
      # 检查 frontend 与 internal-frontend 两个端口都在监听。
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233 && nc -z 127.0.0.1 7236"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 本地 OCI registry（ADR-06）。自建产物必须先入 registry 才能按 digest 引用——
  # 本地镜像只有 image ID，无法写成 repo@sha256 形式。接入托管 registry 后
  # 只改地址，digest 引用方式不变。
  registry:
    image: registry@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
    networks: [mgmt]
    volumes:
      - ./data/registry:/var/lib/registry
    ports:
      - "127.0.0.1:${REGISTRY_PORT:?必须显式提供，禁止硬编码}:5000"

  # Buzz Relay 是协作与 NIP-AE 记忆权威（.design/01 §2）。存储与 Core 分离。
  buzz-db:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    networks: [buzz-data]
    environment:
      POSTGRES_DB: ${BUZZ_DB_NAME:?必须显式提供，禁止硬编码}
      POSTGRES_USER: ${BUZZ_DB_USER:?必须显式提供，禁止硬编码}
      POSTGRES_PASSWORD_FILE: /run/secrets/buzz_db_password
    secrets: [buzz_db_password]
    volumes:
      - buzz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # NIP-98 重放守卫的存储。缺它时 operator 面返回「replay check unavailable」
  # 并拒绝请求——fail closed，而不是放行未去重的请求。
  buzz-replay:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    networks: [buzz-data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Relay 的 git 对象与媒体 pack 存 S3 兼容对象存储；缺它时 Relay 的
  # conformance probe 失败并拒绝启动，因此不是可选项。
  buzz-objects:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    networks: [buzz-data]
    env_file:
      - ./secrets/buzz-objects.env
    command: ["server", "/data"]
    volumes:
      - ./data/collab-objects:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # bucket 是运行前提：Relay 不会自己创建它。
  buzz-objects-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    networks: [buzz-data]
    depends_on:
      buzz-objects: { condition: service_healthy }
    env_file:
      - ./secrets/buzz-objects.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # alias obj 由 env_file 中的 MC_HOST_obj 声明，凭据不出现在命令行
        mc mb --ignore-existing "obj/$$BUZZ_S3_BUCKET"
        echo "bucket $$BUZZ_S3_BUCKET 就绪"
    restart: "no"

  # Relay 的 schema 由 buzz-admin migrate 显式建立，与 Temporal 同一形态：
  # 建库与启动分离，避免服务在缺表时反复崩溃重启。
  buzz-schema:
    image: ${REGISTRY_HOST:?必须显式提供，禁止硬编码}/collaboration-relay@sha256:d42f83fa0dadcd78c4ad721047433a9a7c8e522767edd96cb326d641c5dd0056
    networks: [buzz-data]
    depends_on:
      buzz-db: { condition: service_healthy }
    env_file:
      - ./secrets/buzz-relay.env
    entrypoint: ["/usr/local/bin/buzz-admin"]
    command: ["migrate"]
    restart: "no"

  # 07 §1 两条不变式在此落实，二者都是「默认值不安全」：
  #   BUZZ_REQUIRE_RELAY_MEMBERSHIP 默认 false，此时 check_relay_membership
  #   立即返回 OpenRelay，所有已认证调用方一律放行，roster 只是展示事实；
  #   BUZZ_ALLOW_NIP_OA_AUTH 开启后，不在 roster 中的 pubkey 可凭 owner
  #   attestation 以 ViaOwner 通过。原生端本机持钥直连 Relay，Core 不在其
  #   发布路径上，roster 校验是协作数据平面唯一的准入执行点（SF-BUZ-26、DD-75）。
  # 镜像是带 SS-BUZ-GOVERNANCE 改动的本仓库构建（collaboration/），不是上游
  # 发布镜像：上游的 NIP-29 权限比平台宽且无开关可收紧（SF-BUZ-37）。
  buzz-relay:
    image: ${REGISTRY_HOST:?必须显式提供，禁止硬编码}/collaboration-relay@sha256:d42f83fa0dadcd78c4ad721047433a9a7c8e522767edd96cb326d641c5dd0056
    networks:
      component:
        aliases: ["${BUZZ_RELAY_HOST:?必须显式提供，禁止硬编码}"]
      app:
        aliases: ["${BUZZ_RELAY_HOST:?必须显式提供，禁止硬编码}"]
      buzz-data: {}
    depends_on:
      buzz-schema: { condition: service_completed_successfully }
      buzz-objects-init: { condition: service_completed_successfully }
      buzz-replay: { condition: service_healthy }
    environment:
      # Relay 在网内与本机用同一端口：operator 签名 URL、Community host 与连接
      # 地址都带它（SF-BUZ-41），两侧不一致时签名与 Host 绑定都对不上
      BUZZ_BIND_ADDR: 0.0.0.0:${BUZZ_RELAY_PORT:?必须显式提供，禁止硬编码}
      BUZZ_HEALTH_PORT: ${BUZZ_RELAY_HEALTH_PORT:?必须显式提供，禁止硬编码}
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "false"
      # 默认 false 时 REST API 绕过令牌认证（SF-BUZ-27）。WebSocket 协议认证
      # 不受影响，但 REST 面同样承载业务读写，不能留在默认值上。
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      # roster 快照重建会在「同一秒内回到此前出现过的成员集合」时整事务回滚，
      # 快照停留在过期值上；修复只来自这个周期对账（SF-BUZ-34）。它因此是
      # 成员投影查证的收敛上界，必须显式给值而不是留在默认 60 秒。
      BUZZ_NIP43_RECONCILE_INTERVAL_SECS: ${BUZZ_NIP43_RECONCILE_INTERVAL_SECS:?必须显式提供，禁止硬编码}
      # SS-BUZ-GOVERNANCE（DD-80）：成员可发布的 kind，其余只收 Community owner
      # （Tenant CONTROL）签发的；Channel 一律 private。只存在于补丁构建里，
      # 未设定即上游行为——成员可自建 Channel、自加入、读写非 private Channel。
      BUZZ_MEMBER_EVENT_KINDS: ${BUZZ_MEMBER_EVENT_KINDS:?必须显式提供，禁止硬编码}
    env_file:
      - ./secrets/buzz-relay.env
    ports:
      # Desktop/Mobile 直连的协作入口，复用公开绑定地址；Community Host 与
      # operator 签名 URL 保持原值，宿主发布地址不参与身份或签名目标计算。
      - "${PUBLIC_BIND_ADDR:?必须显式提供公开入口发布地址}:${BUZZ_RELAY_PORT:?必须显式提供，禁止硬编码}:${BUZZ_RELAY_PORT:?必须显式提供，禁止硬编码}"
    healthcheck:
      # 镜像里只有 curl，没有 nc。/health 在主路由上（router.rs 的 route("/health")），
      # 不在 BUZZ_HEALTH_PORT 那个探针监听上。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${BUZZ_RELAY_PORT:?必须显式提供，禁止硬编码}/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 原生 OpenMeter 保持 Customer/计量账本权威（DD-37/38）。只接实际 Customer
  # 与原生双侧去重消费者；不用 quickstart seed、额外管理 UI 或无调用方的 billing worker。
  openmeter-postgres:
    image: postgres@sha256:14f02666642586a64d6fae8ef42d479fd76456a77c73ae8a626b8fe323b76d22
    networks: [openmeter-data]
    cpus: ${OPENMETER_POSTGRES_CPUS:?必须显式提供本机运行预算}
    mem_limit: ${OPENMETER_POSTGRES_MEMORY:?必须显式提供本机运行预算}
    memswap_limit: ${OPENMETER_POSTGRES_MEMORY:?必须显式提供本机运行预算}
    environment:
      POSTGRES_DB: ${OPENMETER_DB_NAME:?必须显式提供，禁止硬编码}
      POSTGRES_USER: ${OPENMETER_DB_USER:?必须显式提供，禁止硬编码}
      POSTGRES_PASSWORD_FILE: /run/secrets/openmeter_db_password
    secrets: [openmeter_db_password]
    volumes: [openmeter-postgres-data:/var/lib/postgresql/data]
    command: [postgres, -c, wal_level=logical]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  openmeter-kafka:
    image: confluentinc/cp-kafka@sha256:db5eac24a1d15a1689fa89642ef97a7e3bc4f55ad5159a07b213c4dc7d0114e3
    networks: [openmeter-data]
    cpus: ${OPENMETER_KAFKA_CPUS:?必须显式提供本机运行预算}
    mem_limit: ${OPENMETER_KAFKA_MEMORY:?必须显式提供本机运行预算}
    memswap_limit: ${OPENMETER_KAFKA_MEMORY:?必须显式提供本机运行预算}
    environment:
      KAFKA_HEAP_OPTS: ${OPENMETER_KAFKA_HEAP_OPTS:?必须显式提供原生 JVM heap，禁止默认值}
      CLUSTER_ID: ${OPENMETER_KAFKA_CLUSTER_ID:?必须显式提供，禁止硬编码}
      KAFKA_BROKER_ID: "0"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@openmeter-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://openmeter-kafka:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_MESSAGE_TIMESTAMP_AFTER_MAX_MS: "9223372036854775807"
    volumes:
      - openmeter-kafka-data:/var/lib/kafka/data
      - openmeter-kafka-secrets:/etc/kafka/secrets
    healthcheck:
      # 健康 CLI 复用原生客户端 heap，不能继承 broker 的整份 JVM heap。
      test: [CMD-SHELL, "env -u KAFKA_HEAP_OPTS kafka-topics --bootstrap-server openmeter-kafka:9092 --list >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  openmeter-clickhouse:
    image: clickhouse/clickhouse-server@sha256:74da41cd61db84f652c6364fd30d59e19b7276d34f7c82515f5f0e70d6f325da
    networks: [openmeter-data]
    cpus: ${OPENMETER_CLICKHOUSE_CPUS:?必须显式提供本机运行预算}
    mem_limit: ${OPENMETER_CLICKHOUSE_MEMORY:?必须显式提供本机运行预算}
    memswap_limit: ${OPENMETER_CLICKHOUSE_MEMORY:?必须显式提供本机运行预算}
    environment:
      CLICKHOUSE_USER: ${OPENMETER_CLICKHOUSE_USER:?必须显式提供，禁止硬编码}
      CLICKHOUSE_DB: ${OPENMETER_CLICKHOUSE_DB_NAME:?必须显式提供，禁止硬编码}
      # 固定镜像原生 entrypoint 支持 FILE；它内部初始化 client 仍会使用 --password。
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/openmeter_clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    secrets: [openmeter_clickhouse_password]
    volumes:
      - openmeter-clickhouse-data:/var/lib/clickhouse
      - openmeter-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD, wget, --spider, http://127.0.0.1:8123/ping]
      interval: 5s
      timeout: 3s
      retries: 30

  openmeter:
    image: ${REGISTRY_HOST:?必须显式提供，禁止硬编码}/metering@sha256:9881721605755f4f0ef95e340f2e8c43f05208d3d33876e3734f61d746ea6783
    networks:
      app:
        aliases: ["${OPENMETER_HOST:?必须显式提供，禁止硬编码}"]
      openmeter-data: {}
    cpus: ${OPENMETER_API_CPUS:?必须显式提供本机运行预算}
    mem_limit: ${OPENMETER_API_MEMORY:?必须显式提供本机运行预算}
    memswap_limit: ${OPENMETER_API_MEMORY:?必须显式提供本机运行预算}
    depends_on:
      openmeter-postgres: {condition: service_healthy}
      openmeter-kafka: {condition: service_healthy}
      openmeter-clickhouse: {condition: service_healthy}
      openmeter-dedupe: {condition: service_healthy}
    command: [openmeter, --address, "0.0.0.0:${OPENMETER_API_PORT:?必须显式提供，禁止硬编码}", --config, "${OPENMETER_CONFIG_FILE:?必须显式提供，禁止硬编码}"]
    # 裸 Viper 的真实键，无 OPENMETER_ 前缀；密码走受控 env_file，token 仅走文件。
    environment:
      SERVER_CORESERVICETOKENFILE: ${OPENMETER_CORE_TOKEN_FILE:?必须显式提供，禁止硬编码}
      NAMESPACE_DEFAULT: ${OPENMETER_NAMESPACE:?必须显式提供，禁止硬编码}
      POSTGRES_HOST: openmeter-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ${OPENMETER_DB_NAME:?必须显式提供，禁止硬编码}
      POSTGRES_USER: ${OPENMETER_DB_USER:?必须显式提供，禁止硬编码}
      POSTGRES_OPTIONS_SSLVERIFY: disable
      AGGREGATION_CLICKHOUSE_ADDRESS: openmeter-clickhouse:9000
      AGGREGATION_CLICKHOUSE_USERNAME: ${OPENMETER_CLICKHOUSE_USER:?必须显式提供，禁止硬编码}
      AGGREGATION_CLICKHOUSE_DATABASE: ${OPENMETER_CLICKHOUSE_DB_NAME:?必须显式提供，禁止硬编码}
      INGEST_KAFKA_BROKER: openmeter-kafka:9092
      OPENMETER_API_PORT: ${OPENMETER_API_PORT:?必须显式提供，禁止硬编码}
    env_file: [./secrets/openmeter.env]
    configs:
      - source: openmeter_usage_config
        target: ${OPENMETER_CONFIG_FILE:?必须显式提供，禁止硬编码}
    secrets:
      - source: openmeter_core_token
        target: ${OPENMETER_CORE_TOKEN_FILE:?必须显式提供，禁止硬编码}
    healthcheck:
      # 原生镜像有 Bash 而无 curl。令牌仅进进程内存与 HTTP header，不上 argv/日志。
      # 只读真实 v3 Customer API 返回 200 才就绪，不把无认证 /health 或 TCP 当业务 ready。
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          set -euo pipefail
          token=$$(<"$$SERVER_CORESERVICETOKENFILE")
          [ -n "$$token" ]
          exec 3<>"/dev/tcp/127.0.0.1/$$OPENMETER_API_PORT"
          printf 'GET /api/v3/openmeter/customers HTTP/1.1\r\nHost: localhost\r\nAuthorization: Bearer %s\r\nConnection: close\r\n\r\n' "$$token" >&3
          unset token
          read -r protocol status reason <&3
          [[ "$$protocol" == HTTP/1.* && "$$status" == 200 ]]
      interval: 5s
      timeout: ${OPENMETER_HTTP_TIMEOUT_SECONDS:?必须显式提供，禁止硬编码}s
      retries: 40

  # 去重索引归 OpenMeter 自有存储，不是另一份 Usage/额度账本；无跨组件网络或宿主端口。
  # 固定版本原生 Redis：noeviction 不允许内存压力驱逐键使重复事件重新变成 unique；
  # AOF always 保留已确认的索引写入，但不宣称消除原生 Kafka/ClickHouse 崩溃窗口。
  openmeter-dedupe:
    image: redis@sha256:c6e4a82ce60b829a72a21cc4ad4c1c274fa6962eb0d6ac698e8157cbc3fe16a4
    networks: [openmeter-data]
    cpus: ${OPENMETER_REDIS_CPUS:?必须显式提供本机运行预算}
    mem_limit: ${OPENMETER_REDIS_MEMORY:?必须显式提供本机运行预算}
    memswap_limit: ${OPENMETER_REDIS_MEMORY:?必须显式提供本机运行预算}
    command:
      - redis-server
      - --port
      - ${OPENMETER_REDIS_PORT:?必须显式提供，禁止硬编码}
      - --databases
      - ${OPENMETER_REDIS_DATABASES:?必须显式提供，禁止硬编码}
      - --maxmemory
      - ${OPENMETER_REDIS_MAXMEMORY:?必须显式提供本机运行预算}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - always
    volumes: [openmeter-dedupe-data:/data]
    healthcheck:
      test: [CMD-SHELL, "redis-cli -p ${OPENMETER_REDIS_PORT:?必须显式提供，禁止硬编码} ping | grep -qx PONG"]
      interval: ${OPENMETER_REDIS_HEALTH_INTERVAL_SECONDS:?必须显式提供健康检查间隔}s
      timeout: ${OPENMETER_REDIS_HEALTH_TIMEOUT_SECONDS:?必须显式提供健康检查超时}s
      retries: ${OPENMETER_REDIS_HEALTH_RETRIES:?必须显式提供健康检查重试次数}

  # 同一镜像的真实原生消费者，把 Kafka 用量持久到 ClickHouse；零 meter 时不造事件。
  # 只接自己的数据网络，无 Core credential、共享网络或宿主发布端口。
  openmeter-sink-worker:
    image: ${REGISTRY_HOST:?必须显式提供，禁止硬编码}/metering@sha256:9881721605755f4f0ef95e340f2e8c43f05208d3d33876e3734f61d746ea6783
    networks: [openmeter-data]
    cpus: ${OPENMETER_SINK_CPUS:?必须显式提供本机运行预算}
    mem_limit: ${OPENMETER_SINK_MEMORY:?必须显式提供本机运行预算}
    memswap_limit: ${OPENMETER_SINK_MEMORY:?必须显式提供本机运行预算}
    depends_on:
      openmeter: {condition: service_healthy}
      openmeter-postgres: {condition: service_healthy}
      openmeter-kafka: {condition: service_healthy}
      openmeter-clickhouse: {condition: service_healthy}
      openmeter-dedupe: {condition: service_healthy}
    command: [openmeter-sink-worker, --config, "${OPENMETER_CONFIG_FILE:?必须显式提供，禁止硬编码}"]
    environment:
      NAMESPACE_DEFAULT: ${OPENMETER_NAMESPACE:?必须显式提供，禁止硬编码}
      POSTGRES_HOST: openmeter-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ${OPENMETER_DB_NAME:?必须显式提供，禁止硬编码}
      POSTGRES_USER: ${OPENMETER_DB_USER:?必须显式提供，禁止硬编码}
      POSTGRES_OPTIONS_SSLVERIFY: disable
      AGGREGATION_CLICKHOUSE_ADDRESS: openmeter-clickhouse:9000
      AGGREGATION_CLICKHOUSE_USERNAME: ${OPENMETER_CLICKHOUSE_USER:?必须显式提供，禁止硬编码}
      AGGREGATION_CLICKHOUSE_DATABASE: ${OPENMETER_CLICKHOUSE_DB_NAME:?必须显式提供，禁止硬编码}
      INGEST_KAFKA_BROKER: openmeter-kafka:9092
      TELEMETRY_ADDRESS: "127.0.0.1:${OPENMETER_SINK_TELEMETRY_PORT:?必须显式提供，禁止硬编码}"
      OPENMETER_SINK_TELEMETRY_PORT: ${OPENMETER_SINK_TELEMETRY_PORT:?必须显式提供，禁止硬编码}
    env_file: [./secrets/openmeter.env]
    configs:
      - source: openmeter_usage_config
        target: ${OPENMETER_CONFIG_FILE:?必须显式提供，禁止硬编码}
    healthcheck:
      # 仅确认真实 native readiness，不把它当 Usage 已 COMMITTED 或业务验收。
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          set -euo pipefail
          exec 3<>"/dev/tcp/127.0.0.1/$$OPENMETER_SINK_TELEMETRY_PORT"
          printf 'GET /healthz/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r protocol status reason <&3
          [[ "$$protocol" == HTTP/1.* && "$$status" == 200 ]]
      interval: ${OPENMETER_SINK_HEALTH_INTERVAL_SECONDS:?必须显式提供健康检查间隔}s
      timeout: ${OPENMETER_SINK_HEALTH_TIMEOUT_SECONDS:?必须显式提供健康检查超时}s
      retries: ${OPENMETER_SINK_HEALTH_RETRIES:?必须显式提供健康检查重试次数}

  # Platform Core/BFF：单一模块化 Rust 服务，共享业务事务边界（DD-05）。
  # 它只接受 AgentGateway 投影的内网身份 header，缺任一条即拒绝（.design/09）。
  # 只在 app 网络：Browser 永远到不了它，必须经 edge 上的网关。
  core-bff:
    image: ${REGISTRY_HOST:?必须显式提供，禁止硬编码}/core@sha256:53e94494f9b36c0109607d0cf8cf6e425527bc359305aa7866b137b5821d496a
    build:
      context: ../..
      dockerfile: core/Dockerfile
    networks: [app, core-data]
    depends_on:
      core-db: { condition: service_healthy }
      openmeter: { condition: service_healthy }
      temporal: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      BFF_LISTEN: ${BFF_BIND_ADDR:?必须显式提供，禁止硬编码}:${BFF_CONTAINER_PORT:?必须显式提供，禁止硬编码}
      # PlatformSession 有效期。部署事实：不同部署对「多久重新过一次 OIDC」
      # 的要求不同，写死会让这件事变成改代码才能调。
      PLATFORM_SESSION_TTL_SECONDS: ${PLATFORM_SESSION_TTL_SECONDS:?必须显式提供，禁止硬编码}
      # 历史查询单页上界。NIP-11 声明的 1000 是 Relay 的上限，不是平台该
      # 放行的值——上界在 BFF 侧先行设定（07 §5）。
      BFF_MESSAGE_PAGE_LIMIT: ${BFF_MESSAGE_PAGE_LIMIT:?必须显式提供，禁止硬编码}
      # 实时订阅走 NIP-42 WebSocket 会话；Community host 另从 binding 取
      BUZZ_RELAY_WS_URL: ws://${BUZZ_RELAY_HOST:?必须显式提供，禁止硬编码}:${BUZZ_RELAY_PORT:?必须显式提供，禁止硬编码}
      # 单条流的缓冲帧数。满了对上游形成背压而不是丢帧
      BFF_STREAM_BUFFER: ${BFF_STREAM_BUFFER:?必须显式提供，禁止硬编码}
      # 连上 Relay 后等 NIP-42 challenge 的上界；超时即以可处理的失败结束该流
      BFF_STREAM_AUTH_TIMEOUT_SECONDS: ${BFF_STREAM_AUTH_TIMEOUT_SECONDS:?必须显式提供，禁止硬编码}
      # Core 的已接入 Relay 预算和 NIP-11 观察上界，来自唯一部署配置。
      BFF_RELAY_API_BUDGET: ${BFF_RELAY_API_BUDGET:?必须显式提供，禁止硬编码}
      BFF_RELAY_API_BUDGET_WINDOW_SECONDS: ${BFF_RELAY_API_BUDGET_WINDOW_SECONDS:?必须显式提供，禁止硬编码}
      BFF_RELAY_NIP11_TTL_SECONDS: ${BFF_RELAY_NIP11_TTL_SECONDS:?必须显式提供，禁止硬编码}
      BFF_MESSAGE_MAX_CONTENT_BYTES: ${BFF_MESSAGE_MAX_CONTENT_BYTES:?必须显式提供，禁止硬编码}
      # 撤权对已建立流生效的上界。请求路径上撤权立刻生效，长连接靠这个周期
      # 回头看——它是一个必须被说出来的时间窗（07 §1）。
      BFF_STREAM_READMIT_SECONDS: ${BFF_STREAM_READMIT_SECONDS:?必须显式提供，禁止硬编码}
      # 断线后浏览器重连前的等待，经 SSE retry: 下发。重连由浏览器的
      # EventSource 自己做；间隔由部署决定，客户端代码里没有任何时长。
      BFF_STREAM_RETRY_MILLIS: ${BFF_STREAM_RETRY_MILLIS:?必须显式提供，禁止硬编码}
      # 单份媒体的上界。压力在 BFF 侧先行设界，不透传给 Relay（07 §5）
      BFF_MEDIA_MAX_BYTES: ${BFF_MEDIA_MAX_BYTES:?必须显式提供，禁止硬编码}
      # 设备持钥证明允许的时钟偏差：截获的证明最多还能用这么久（DD-79）
      BFF_CLIENT_KEY_PROOF_WINDOW_SECONDS: ${BFF_CLIENT_KEY_PROOF_WINDOW_SECONDS:?必须显式提供，禁止硬编码}
      # 部署显示名（DD-111）：BFF 的公开平台信息与 Web 静态入口投影自同一个值；缺失即拒绝启动
      PLATFORM_DISPLAY_NAME: ${PLATFORM_DISPLAY_NAME:?必须显式提供，禁止硬编码}
      # 每人可同时登记的原生设备上界（DD-77）
      BFF_CLIENT_KEYS_PER_PRINCIPAL: ${BFF_CLIENT_KEYS_PER_PRINCIPAL:?必须显式提供，禁止硬编码}
      # 设备投影仍在收敛时，原生端按服务端给出的间隔重查，不在客户端写死
      BFF_CLIENT_KEY_RECHECK_MILLIS: ${BFF_CLIENT_KEY_RECHECK_MILLIS:?必须显式提供，禁止硬编码}
      # 原生端直连 Relay 的地址模板，{host} 由 Community host 代入（DD-75/78）。
      # 它是「原生端从哪里能连到 Relay」的部署事实，与 BFF 自己连 Relay 用的
      # BUZZ_RELAY_WS_URL 不是一回事——后者是网内地址，前者要在客户端所在网络可达，
      # 且主机名必须就是 Community host（Relay 按 Host 绑定 Community，SF-BUZ-32）。
      BUZZ_RELAY_NATIVE_URL_TEMPLATE: ${BUZZ_RELAY_NATIVE_URL_TEMPLATE:?必须显式提供，禁止硬编码}
      # service API 与 BFF 分端口：网关以 pathPrefix: / 整体转发给 BFF，
      # 同端口的服务面等于对任何已登录用户开放。
      SERVICE_LISTEN: ${SERVICE_BIND_ADDR:?必须显式提供，禁止硬编码}:${SERVICE_CONTAINER_PORT:?必须显式提供，禁止硬编码}
      SERVICE_OIDC_ISSUER: ${OIDC_ISSUER:?必须显式提供，禁止硬编码}
      SERVICE_OIDC_JWKS_URI: ${OIDC_ISSUER:?必须显式提供，禁止硬编码}/protocol/openid-connect/certs
      # 「这张票是开给 Core 的」与「是谁来敲的」是两件事，两条都要核。
      SERVICE_OIDC_AUDIENCE: ${OIDC_SERVICE_CLIENT_ID:?必须显式提供，禁止硬编码}
      SERVICE_CALLER_CLIENT_ID: ${OIDC_WORKER_CLIENT_ID:?必须显式提供，禁止硬编码}
      # DD-105: optional as one complete group, never a Worker credential alias.
      GATEWAY_SERVICE_ISSUER: ${GATEWAY_SERVICE_ISSUER:-}
      GATEWAY_SERVICE_AUDIENCE: ${GATEWAY_SERVICE_AUDIENCE:-}
      GATEWAY_SERVICE_CALLER_ID: ${GATEWAY_SERVICE_CALLER_ID:-}
      GATEWAY_SERVICE_JWKS_FILE: ${GATEWAY_SERVICE_JWKS_FILE:-}
      GATEWAY_SERVICE_MAX_TOKEN_SECONDS: ${GATEWAY_SERVICE_MAX_TOKEN_SECONDS:-}
      GATEWAY_SERVICE_SIGNING_KEY_FILE: ${GATEWAY_SERVICE_SIGNING_KEY_FILE:-}
      GATEWAY_SERVICE_KEY_ID: ${GATEWAY_SERVICE_KEY_ID:-}
      GATEWAY_SERVICE_TOKEN_SECONDS: ${GATEWAY_SERVICE_TOKEN_SECONDS:-}
      AGENT_TOOL_MCP_URL: ${AGENT_TOOL_MCP_URL:-}
      AGENT_TOOL_EXT_MCP_URL: ${AGENT_TOOL_EXT_MCP_URL:-}
      AGENT_TOOL_SESSION_ISSUER: ${AGENT_TOOL_SESSION_ISSUER:-}
      AGENT_TOOL_SESSION_AUDIENCE: ${AGENT_TOOL_SESSION_AUDIENCE:-}
      AGENT_TOOL_SESSION_TOKEN_SECONDS: ${AGENT_TOOL_SESSION_TOKEN_SECONDS:-}
      AGENT_TOOL_GATEWAY_URL: ${AGENT_TOOL_GATEWAY_URL:-}
      AGENT_TOOL_GATEWAY_NAME: ${AGENT_TOOL_GATEWAY_NAME:-}
      # SecretRef 解析（DD-70）。role_id/secret_id 经 env_file 投递，
      # 由 secret-store-init.sh 生成并被 gitignore；不进 .env、不上命令行。
      OPENBAO_ADDR: ${OPENBAO_ADDR:?必须显式提供，禁止硬编码}
      OPENBAO_HTTP_TIMEOUT_SECONDS: ${OPENBAO_HTTP_TIMEOUT_SECONDS:?必须显式提供，禁止硬编码}
      OPENBAO_PLATFORM_NAMESPACE: ${OPENBAO_PLATFORM_NAMESPACE:?必须显式提供，禁止硬编码}
      OPENBAO_TENANT_PARENT_NAMESPACE: ${OPENBAO_TENANT_PARENT_NAMESPACE:?必须显式提供，禁止硬编码}
      OPENBAO_KV_MOUNT: ${OPENBAO_KV_MOUNT:?必须显式提供，禁止硬编码}
      OPENBAO_KV_MAX_VERSIONS: ${OPENBAO_KV_MAX_VERSIONS:?必须显式提供，禁止硬编码}
      OPENBAO_TENANT_CORE_ROLE_NAME: ${OPENBAO_TENANT_CORE_ROLE_NAME:?必须显式提供，禁止硬编码}
      OPENBAO_SECRET_ID_TTL: ${OPENBAO_SECRET_ID_TTL:?必须显式提供，禁止硬编码}
      OPENBAO_TOKEN_PERIOD: ${OPENBAO_TOKEN_PERIOD:?必须显式提供，禁止硬编码}
      # SecretRef 的 audience 必须等于它，否则拒绝取用
      OPENBAO_SERVICE_IDENTITY: ${OIDC_SERVICE_CLIENT_ID:?必须显式提供，禁止硬编码}
      # SS-OMT-AUTH：Core 使用与原生 API 同源的服务 token，不取 Browser 凭据。
      OPENMETER_CUSTOMERS_URL: ${OPENMETER_CUSTOMERS_URL:?必须显式提供，禁止硬编码}
      OPENMETER_NAMESPACE: ${OPENMETER_NAMESPACE:?必须显式提供，禁止硬编码}
      OPENMETER_HTTP_TIMEOUT_SECONDS: ${OPENMETER_HTTP_TIMEOUT_SECONDS:?必须显式提供，禁止硬编码}
      OPENMETER_CORE_TOKEN_FILE: ${OPENMETER_CORE_TOKEN_FILE:?必须显式提供，禁止硬编码}
      AGENTGATEWAY_ADMIN_URL: ${AGENTGATEWAY_ADMIN_URL:?必须显式提供已认证的管理入口}
      AGENTGATEWAY_ADMIN_TIMEOUT_SECONDS: ${AGENTGATEWAY_ADMIN_TIMEOUT_SECONDS:?必须显式提供管理请求时限}
      AGENTGATEWAY_MODEL_BASE_URL: ${AGENTGATEWAY_MODEL_BASE_URL:?必须显式提供 Gateway 私网模型入口}
      AGENTGATEWAY_PROVIDER_SECRET_DIRECTORY: ${AGENTGATEWAY_PROVIDER_SECRET_DIRECTORY:?必须显式提供 Gateway 独占凭据目录}
      AGENT_CAPACITY_POOL_KEY: ${AGENT_CAPACITY_POOL_KEY:?必须显式提供平台槽位池}
      AGENT_CAPACITY_POOL_UNITS: ${AGENT_CAPACITY_POOL_UNITS:?必须显式提供平台槽位容量}
      AGENT_CAPACITY_UNITS_PER_INVOCATION: ${AGENT_CAPACITY_UNITS_PER_INVOCATION:?必须显式提供单次占用}
      AGENT_CAPACITY_LEASE_SECONDS: ${AGENT_CAPACITY_LEASE_SECONDS:?必须显式提供租约期限}
      # 可选运行目录的同源 meter pin；缺省为空，Core 不登记 automation.run。
      AUTOMATION_RUN_METERS_JSON: ${AUTOMATION_RUN_METERS_JSON:-}
      AGENT_INVOKE_METERS_JSON: ${AGENT_INVOKE_METERS_JSON:-}
      WORKER_AGENT_ACTIVITY_HEARTBEAT_TIMEOUT_SECONDS: ${WORKER_AGENT_ACTIVITY_HEARTBEAT_TIMEOUT_SECONDS:?必须显式提供原生心跳期限}
      WORKER_AGENT_ACTIVITY_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_AGENT_ACTIVITY_HEARTBEAT_INTERVAL_SECONDS:?必须显式提供心跳间隔}
      WORKER_CONVERGE_ROUND_INTERVAL_SECONDS: ${WORKER_CONVERGE_ROUND_INTERVAL_SECONDS:?必须显式提供观察轮间隔}
      AGENT_MEMORY_LIST_LIMIT: ${AGENT_MEMORY_LIST_LIMIT:?必须显式提供完整 listing 上界}
      AGENT_MEMORY_MAX_DECOMPRESSED_BYTES: ${AGENT_MEMORY_MAX_DECOMPRESSED_BYTES:?必须显式提供原生正文上界}
      AGENT_MEMORY_RELAY_TIMESTAMP_WINDOW_SECONDS: ${AGENT_MEMORY_RELAY_TIMESTAMP_WINDOW_SECONDS:?必须显式提供固定 Relay 时间窗口}
      AGENT_MEMORY_READ_TIMEOUT_SECONDS: ${AGENT_MEMORY_READ_TIMEOUT_SECONDS:?必须显式提供完整 Memory 读取时限}
      # Relay 的网络地址。与 Community host 不是一回事：后者参与 NIP-98
      # 签名并作为 Host 头，前者只用于建立连接（SF-BUZ-32）。
      BUZZ_RELAY_TRANSPORT: http://${BUZZ_RELAY_HOST:?必须显式提供，禁止硬编码}:${BUZZ_RELAY_PORT:?必须显式提供，禁止硬编码}
      # Core 在 Start 前持久化 WorkflowRef，再以固定 ID 启动（DD-48）。
      # namespace 写错即全部调用被拒：Temporal 的 default claim mapper 按
      # "<namespace>:<role>" 解析 permissions（SF-TMP-06）。
      TEMPORAL_TARGET_URL: http://${TEMPORAL_ADDRESS:?必须显式提供，禁止硬编码}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:?必须显式提供，禁止硬编码}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:?必须显式提供，禁止硬编码}
      OIDC_TOKEN_URL: ${OIDC_ISSUER:?必须显式提供，禁止硬编码}/protocol/openid-connect/token
      OIDC_SERVICE_CLIENT_ID: ${OIDC_SERVICE_CLIENT_ID:?必须显式提供，禁止硬编码}
      # 平台引导（.design/09 第 3 步）：Catalog Tenant 与 RelayOperatorIdentity。
      # operator 私钥经 secret 挂载读入，写进 OpenBao 后只留 locator 与版本。
      PLATFORM_CATALOG_TENANT_SLUG: ${PLATFORM_CATALOG_TENANT_SLUG:?必须显式提供，禁止硬编码}
      RELAY_OPERATOR_AUDIENCE: ${RELAY_OPERATOR_AUDIENCE:?必须显式提供，禁止硬编码}
      # DD-115：operator 私钥写入意图的提交截止时限（秒）。冻结意图时写入截止时刻，绑定只能在截止前提交；
      # 过截止即终态，由引导或对账器按 DD-86 隔离销毁。它只决定慢引导能否完成，不影响安全
      RELAY_OPERATOR_COMMIT_WINDOW_SECONDS: ${RELAY_OPERATOR_COMMIT_WINDOW_SECONDS:?必须显式提供，禁止硬编码}
      RELAY_OPERATOR_API_ORIGIN: http://${BUZZ_RELAY_HOST:?必须显式提供，禁止硬编码}:${BUZZ_RELAY_PORT:?必须显式提供，禁止硬编码}
      # Community host = <tenant slug>.<domain>。host 是 NIP-98 的签名权威
      # （SF-BUZ-32），必须稳定可推导。
      BUZZ_COMMUNITY_DOMAIN: ${BUZZ_COMMUNITY_DOMAIN:?必须显式提供，禁止硬编码}
      CORE_DB_MAX_CONNECTIONS: ${CORE_DB_MAX_CONNECTIONS:?必须显式提供，禁止硬编码}
      BUZZ_WEB_BUILD_INFO_URL: http://${WEB_SERVICE_NAME:?必须显式提供，禁止硬编码}:${WEB_CONTAINER_PORT:?必须显式提供，禁止硬编码}/app/platform-build-info.json
      COMPONENT_BUILD_INFO_TIMEOUT_SECONDS: ${COMPONENT_BUILD_INFO_TIMEOUT_SECONDS:-}
      COMPONENT_BUILD_INFO_MAX_BYTES: ${COMPONENT_BUILD_INFO_MAX_BYTES:-}
      # 运维信号只经 OTLP 交给 Collector（ADR-05）；导出周期是 SDK 的标准变量
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?必须显式提供，禁止硬编码}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:?必须显式提供，禁止硬编码}
      # 兜底对账（.design/06 §3.1）：WorkflowRef 超过新鲜度上界仍非终态才按固定
      # ID 去 Temporal 查；每轮条数有上界，按最久未观察的先查。
      WORKFLOW_RECONCILE_INTERVAL_SECONDS: ${WORKFLOW_RECONCILE_INTERVAL_SECONDS:?必须显式提供，禁止硬编码}
      WORKFLOW_PROJECTION_FRESHNESS_SECONDS: ${WORKFLOW_PROJECTION_FRESHNESS_SECONDS:?必须显式提供，禁止硬编码}
      WORKFLOW_RECONCILE_BATCH: ${WORKFLOW_RECONCILE_BATCH:?必须显式提供，禁止硬编码}
      # roster 与 Core 成员事实的对账周期（07 §3）。每轮以各 Tenant 的 CONTROL
      # 身份读一次 relay roster 与每个 Channel roster，只度量、不修复。
      ROSTER_RECONCILE_INTERVAL_SECONDS: ${ROSTER_RECONCILE_INTERVAL_SECONDS:?必须显式提供，禁止硬编码}
      # 结果不明的消息发布按 event id 对账（DD-81）。settle 必须不小于 Relay 的
      # 时间漂移窗口：超出窗口仍查不到，这条事件才确定不会再被接受（07 §1）。
      PUBLISH_RECONCILE_INTERVAL_SECONDS: ${PUBLISH_RECONCILE_INTERVAL_SECONDS:?必须显式提供，禁止硬编码}
      PUBLISH_RESULT_SETTLE_SECONDS: ${PUBLISH_RESULT_SETTLE_SECONDS:?必须显式提供，禁止硬编码}
      PUBLISH_RECONCILE_BATCH: ${PUBLISH_RECONCILE_BATCH:?必须显式提供，禁止硬编码}
      PUBLISH_IDEMPOTENCY_RETENTION_SECONDS: ${PUBLISH_IDEMPOTENCY_RETENTION_SECONDS:?必须显式提供，禁止硬编码}
      # 治理内核（.design/05 §1、.design/06 §4）。准入的 fresh Check 经 SpiceDB 的
      # HTTP gateway（ADR-10）；preshared key 经 env_file 投递。
      SPICEDB_HTTP_URL: ${SPICEDB_HTTP_URL:?必须显式提供，禁止硬编码}
      # APPROVED 之后等待 consume 的上界，冻结进 ApprovalWorkflow input；超时自动 INVALIDATED
      APPROVAL_CONSUME_WINDOW_SECONDS: ${APPROVAL_CONSUME_WINDOW_SECONDS:?必须显式提供，禁止硬编码}
      # 批准后派发前必须距 consume 截止至少留出的余量；不足则不派发，让批准按期失效
      APPROVAL_DISPATCH_MARGIN_SECONDS: ${APPROVAL_DISPATCH_MARGIN_SECONDS:?必须显式提供，禁止硬编码}
      # 同步等一个 Temporal Update 完成的上界；超过即结果不明，以同一 Update ID 再问
      TEMPORAL_UPDATE_WAIT_SECONDS: ${TEMPORAL_UPDATE_WAIT_SECONDS:?必须显式提供，禁止硬编码}
      # EVALUATING 与「已允许未派发」被视为停滞、交给对账作业的年龄
      ADMISSION_EVALUATION_TIMEOUT_SECONDS: ${ADMISSION_EVALUATION_TIMEOUT_SECONDS:?必须显式提供，禁止硬编码}
      GOVERNANCE_RECONCILE_INTERVAL_SECONDS: ${GOVERNANCE_RECONCILE_INTERVAL_SECONDS:?必须显式提供，禁止硬编码}
      GOVERNANCE_RECONCILE_BATCH: ${GOVERNANCE_RECONCILE_BATCH:?必须显式提供，禁止硬编码}
      SECRET_REF_REHOME_ALERT_AFTER_SECONDS: ${SECRET_REF_REHOME_ALERT_AFTER_SECONDS:?必须显式提供，禁止硬编码}
      # 任务列表与待我审批列表的单页上界（07 §5）
      BFF_TASK_PAGE_LIMIT: ${BFF_TASK_PAGE_LIMIT:?必须显式提供，禁止硬编码}
      BFF_ROLE_MEMBER_PAGE_LIMIT: ${BFF_ROLE_MEMBER_PAGE_LIMIT:?必须显式提供，禁止硬编码}
      # 从 SpiceDB 读关系的单页条数（角色判定与对账）。读取总是翻到底，它只约束
      # 单次回应的大小（DD-82）
      SPICEDB_READ_PAGE_LIMIT: ${SPICEDB_READ_PAGE_LIMIT:?必须显式提供，禁止硬编码}
      # 角色 relationship 以成员事实为准对账的周期；也是「Tenant 没有有效 admin」
      # 度量的刷新周期（DD-82）
      ROLE_RECONCILE_INTERVAL_SECONDS: ${ROLE_RECONCILE_INTERVAL_SECONDS:?必须显式提供，禁止硬编码}
      # 部署引导（ADR-11）登记首位 admin 的外部身份时所属的 IdP：与浏览器登录的
      # issuer 与 client 相同，身份解析才能在首次登录时找到这个人
      HUMAN_OIDC_ISSUER: ${OIDC_ISSUER:?必须显式提供，禁止硬编码}
      HUMAN_OIDC_CLIENT_ID: ${OIDC_BROWSER_CLIENT_ID:?必须显式提供，禁止硬编码}
      # Tenant 成员邀请（DD-83）：有效期在签发时冻结进邀请；链接基址是部署的 Web
      # 地址加 Web 端兑换页的路径，一次性凭据接在 # 之后（fragment 不发往任何服务端）
      TENANT_INVITATION_TTL_SECONDS: ${TENANT_INVITATION_TTL_SECONDS:?必须显式提供，禁止硬编码}
      TENANT_INVITATION_LINK_BASE: ${PUBLIC_ORIGIN:?必须显式提供，禁止硬编码}/app/invite
    env_file:
      - ./secrets/core-db-url.env
      - ./secrets/openbao-core.env
      # Core 自己的 OIDC client secret；不进 .env、不上命令行
      - ./secrets/core-service.env
      # SpiceDB preshared key（SPICEDB_PRESHARED_KEY）；不进 .env、不上命令行
      - ./secrets/core-spicedb.env
    secrets:
      - source: openmeter_core_token
        target: ${OPENMETER_CORE_TOKEN_FILE:?必须显式提供，禁止硬编码}
    ports:
      # 仅绑回环，供本机核验 service API；不暴露到宿主网络之外。
      - "127.0.0.1:${SERVICE_PORT:?必须显式提供，禁止硬编码}:${SERVICE_CONTAINER_PORT:?必须显式提供，禁止硬编码}"
      # BFF 面同样仅绑回环，供本机核验。它信任的只有网关投影的两条 header，
      # 而伪造 header 拿不到任何身份——core/verify/identity-chain.md 已实测。
      - "127.0.0.1:${BFF_PORT:?必须显式提供，禁止硬编码}:${BFF_CONTAINER_PORT:?必须显式提供，禁止硬编码}"

  # Application Worker：Temporal Server 不执行应用逻辑，Workflow Task 必须由它
  # poll 并 Respond（SF-TMP-02）。它同时接 SpiceDB（关系投影）与 Core service
  # API（状态投影与 Buzz roster 投影）——Buzz 的签名留在 Core，CONTROL 私钥在
  # 那里（DD-72）。
  worker:
    image: ${REGISTRY_HOST:?必须显式提供，禁止硬编码}/worker@sha256:91c47ea6ca4b853eefcf3ae4880ea7ac41c5f1f17f697ff37046341f92377ba5
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    # app 到 Core 与 Temporal，component 到 SpiceDB 与 Keycloak。
    # 不接 edge：它不对外提供任何入口。
    networks: [app, component]
    depends_on:
      temporal: { condition: service_healthy }
      spicedb: { condition: service_healthy }
      core-bff: { condition: service_started }
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?必须显式提供，禁止硬编码}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:?必须显式提供，禁止硬编码}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:?必须显式提供，禁止硬编码}
      # 令牌按需取并在到期前复用：本部署签发 900 秒，持静态令牌只是把失败
      # 推迟到第一次续期之后。
      OIDC_TOKEN_URL: ${OIDC_ISSUER:?必须显式提供，禁止硬编码}/protocol/openid-connect/token
      OIDC_WORKER_CLIENT_ID: ${OIDC_WORKER_CLIENT_ID:?必须显式提供，禁止硬编码}
      CORE_SERVICE_URL: http://core-bff:${SERVICE_CONTAINER_PORT:?必须显式提供，禁止硬编码}
      SPICEDB_ENDPOINT: ${SPICEDB_ENDPOINT:?必须显式提供，禁止硬编码}
      SPICEDB_INSECURE: "true"
      # 每个 Activity 显式固定两个超时与重试上界（.design/06 §5.1）。上界约束的是
      # 一轮：一轮耗尽而结果仍不明时，Workflow 以持久 timer 等一轮再做——撤权
      # 必须闭合（DD-45）。卡住多久由 Core 的兜底对账度量。
      WORKER_ACTIVITY_START_TO_CLOSE_SECONDS: ${WORKER_ACTIVITY_START_TO_CLOSE_SECONDS:?必须显式提供，禁止硬编码}
      WORKER_ACTIVITY_SCHEDULE_TO_CLOSE_SECONDS: ${WORKER_ACTIVITY_SCHEDULE_TO_CLOSE_SECONDS:?必须显式提供，禁止硬编码}
      WORKER_ACTIVITY_MAX_ATTEMPTS: ${WORKER_ACTIVITY_MAX_ATTEMPTS:?必须显式提供，禁止硬编码}
      WORKER_CONVERGE_ROUND_INTERVAL_SECONDS: ${WORKER_CONVERGE_ROUND_INTERVAL_SECONDS:?必须显式提供，禁止硬编码}
      WORKER_ACTIVITY_RETRY_INITIAL_SECONDS: ${WORKER_ACTIVITY_RETRY_INITIAL_SECONDS:?必须显式提供，禁止硬编码}
      WORKER_AGENT_ACTIVITY_HEARTBEAT_TIMEOUT_SECONDS: ${WORKER_AGENT_ACTIVITY_HEARTBEAT_TIMEOUT_SECONDS:?必须显式提供原生心跳期限}
      WORKER_AGENT_ACTIVITY_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_AGENT_ACTIVITY_HEARTBEAT_INTERVAL_SECONDS:?必须显式提供心跳间隔}
      WORKER_ACTIVITY_RETRY_MAX_SECONDS: ${WORKER_ACTIVITY_RETRY_MAX_SECONDS:?必须显式提供，禁止硬编码}
      # Temporal SDK 的指标经 OTLP 交给 Collector（ADR-05）
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?必须显式提供，禁止硬编码}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:?必须显式提供，禁止硬编码}
    env_file:
      # Worker 自己的 client secret 与 SpiceDB 的 PSK；都不进 .env、不上命令行
      - ./secrets/worker.env

  # Web 面：三端共用 TypeScript 主体的浏览器那一份（DD-74）。
  # 镜像由 tools/build-upstream.sh 从 web-client 构建——固定 commit 的源码加本仓库改动：
  # 把浏览器直连 Relay 与本地 signer 整体移除（SS-WEB-RELAY），
  # 并换成经 BFF 的传输与平台页面（SS-WEB-01）。
  #
  # 它只是静态资源服务：没有后端逻辑、不持任何 secret、不连数据库。
  # 因此只进 app 网络、不进 edge——对外只有 AgentGateway 一个入口，
  # 绕过网关就等于绕过 OIDC。
  buzz-web:
    # digest 与 web-client/fork/upstream.yaml 的 artifact_digest
    # 必须一致，由 check.sh 校验。
    image: ${REGISTRY_HOST:?必须显式提供，禁止硬编码}/web-client@sha256:ebfbe53111f329afe7fd46bb52f6e95764127bad98fb240da49ffffe3a95453e
    networks: [app]
    environment:
      PLATFORM_DISPLAY_NAME: ${PLATFORM_DISPLAY_NAME:?必须显式提供，禁止硬编码}
    # 镜像自带 HEALTHCHECK（/app/healthz），不在这里重复定义。

  # AgentGateway 是 Browser 侧的 OIDC PEP（SS-AGW-OIDC、DD-02）。
  # 镜像由 tools/build-upstream.sh 从 model-gateway（.design/02 §1 的固定 commit）构建——
  # 该 commit 在 v1.6.0-alpha.1 之后且无 tag 包含它，发布镜像缺少
  # http/oidc/browser.rs，而 SS-AGW-OIDC 的 logout 半边依赖其中的 handle_logout。
  agentgateway:
    # digest 与 model-gateway/fork/upstream.yaml 的 artifact_digest
    # 必须一致，由 check.sh 校验——两处不等说明镜像与 manifest 脱节。
    image: ${REGISTRY_HOST:?必须显式提供，禁止硬编码}/model-gateway@sha256:b7e3d559ffd7840d73e278de656879ebe12e925b3766536f9e9952d1fd7a4fff
    # edge 是唯一对外可达层；它同时进 app 以到达 BFF。
    # 不接入 mgmt——admin router 不得与公开入口同面（SS-AGW-ADMIN）。admin 端口
    # （配置里的 adminAddr）不在下方 ports 中发布到宿主；Core 经 app 网络访问，且每个
    # admin 请求都必须带 Core client 的令牌（config.adminAuthentication）。
    # agentgateway-data 是它自己的私有数据网络，只为到达 request log / usage outbox 库。
    networks:
      edge:
        aliases: ["${PUBLIC_HOST:?必须显式提供，禁止硬编码}"]
      app:
        aliases: ["${PUBLIC_HOST:?必须显式提供，禁止硬编码}"]
      agentgateway-data: {}
    depends_on:
      keycloak: { condition: service_healthy }
      # 配了日志库时网关启动即迁移并连接，库不可用则拒绝启动
      agentgateway-db: { condition: service_healthy }
      # 网关起来就该能服务 /app；web 未就绪时先失败，好过把 404 当成「页面没写」
      buzz-web: { condition: service_healthy }
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?必须显式提供，禁止硬编码}
      OIDC_BROWSER_CLIENT_ID: ${OIDC_BROWSER_CLIENT_ID:?必须显式提供，禁止硬编码}
      OIDC_REDIRECT_URI: ${PUBLIC_ORIGIN:?必须显式提供，禁止硬编码}/oauth/callback
      # DD-112：浏览器入口 csrf 策略唯一的额外可信来源（TLS 终结在网关之前时 Origin 与请求地址不一致）
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?必须显式提供，禁止硬编码}
      # 端口只在 BFF_CONTAINER_PORT 一处取值：写两遍迟早有一天只改一处
      BFF_UPSTREAM: ${BFF_SERVICE_NAME:?必须显式提供，禁止硬编码}:${BFF_CONTAINER_PORT:?必须显式提供，禁止硬编码}
      # WEB_CONTAINER_PORT 是镜像事实：buzz-web 的 Caddyfile 监听该端口。
      # 它与 BFF_CONTAINER_PORT 不同——后者由 Core 从 env 读，前者烧在镜像里，
      # 改它必须连着改 web-client 并重建。
      WEB_UPSTREAM: ${WEB_SERVICE_NAME:?必须显式提供，禁止硬编码}:${WEB_CONTAINER_PORT:?必须显式提供，禁止硬编码}
      # 原生端入口（DD-78）：Bearer 令牌的签发者、受众与验签公钥来源
      OIDC_NATIVE_AUDIENCE: ${OIDC_NATIVE_AUDIENCE:?必须显式提供，禁止硬编码}
      OIDC_JWKS_URI: ${OIDC_ISSUER:?必须显式提供，禁止硬编码}/protocol/openid-connect/certs
      # 管理面只接受这个 client 的 client_credentials 令牌（azp 精确匹配），且令牌须带该 audience。
      # 该 client 就是 Core 自己的 service client，不另设身份。
      AGENTGATEWAY_ADMIN_CLIENT_ID: ${OIDC_SERVICE_CLIENT_ID:?必须显式提供，禁止硬编码}
      AGENTGATEWAY_ADMIN_AUDIENCE: ${AGENTGATEWAY_ADMIN_AUDIENCE:?必须显式提供，禁止硬编码}
      AGENTGATEWAY_MODEL_PORT: ${AGENTGATEWAY_MODEL_PORT:?必须显式提供 Gateway 私网模型 listener 端口}
      AGENTGATEWAY_PROVIDER_SECRET_DIRECTORY: ${AGENTGATEWAY_PROVIDER_SECRET_DIRECTORY:?必须显式提供 Gateway 独占凭据目录}
    env_file:
      # 浏览器客户端密钥由网关持有，浏览器不持有。文件在 gitignore 的 secrets/ 下。
      - ./secrets/browser-client.env
      # 日志库连接串（含口令），由 bootstrap.sh 从 agentgateway_db_password 派生
      - ./secrets/agentgateway-db.env
    volumes:
      - agentgateway-provider-secrets:${AGENTGATEWAY_PROVIDER_SECRET_DIRECTORY:?必须显式提供 Gateway 独占凭据目录}
    configs:
      - source: agentgateway_config
        target: /etc/agentgateway/config.yaml
    command: ["-f", "/etc/agentgateway/config.yaml"]
    ports:
      - "${PUBLIC_BIND_ADDR:?必须显式提供公开入口发布地址}:${AGENTGATEWAY_PORT:?必须显式提供，禁止硬编码}:8080"
      # 原生端入口。容器端口是网关配置里 native bind 的端口
      - "${PUBLIC_BIND_ADDR:?必须显式提供，禁止硬编码}:${AGENTGATEWAY_NATIVE_PORT:?必须显式提供，禁止硬编码}:8091"

  # AgentGateway 的 request log 与 durable usage outbox 库（SS-AGW-USAGE）。只在
  # agentgateway-data：除网关外没有服务能到达它；Core 只经已认证的 admin 接口读游标。
  agentgateway-db:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    networks: [agentgateway-data]
    environment:
      POSTGRES_DB: ${AGENTGATEWAY_DB_NAME:?必须显式提供，禁止硬编码}
      POSTGRES_USER: ${AGENTGATEWAY_DB_USER:?必须显式提供，禁止硬编码}
      POSTGRES_PASSWORD_FILE: /run/secrets/agentgateway_db_password
    secrets: [agentgateway_db_password]
    volumes:
      - agentgateway-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # OpenBao 是 secret 的版本、取用、轮换与撤销权威（DD-70）。
  # 不用 server -dev：那是内存 storage 加固定 root token，07 §1 明确禁止它
  # 进入任何 active 拓扑。初始化与解封由 openbao-init 完成。
  openbao:
    image: openbao/openbao@sha256:7d26314820a535ef346f1e63911809e4d356b48068fef00a9dcb3400bb9e11b6
    networks: [app, mgmt]
    # disable_mlock=false 要求进程能锁定内存，否则私钥可被换出（07 §1）
    cap_add: [IPC_LOCK]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    configs:
      - source: openbao_config
        target: /openbao/config/config.hcl
    volumes:
      - ./data/secret-store:/openbao/data
    # 具名卷由 Docker 以 root 创建，而镜像以 uid 100 运行；不改成 root 运行，
    # 而是让卷归属进程自身的 uid，保持最小权限。
    user: "100:1000"
    command: ["server", "-config=/openbao/config/config.hcl"]
    ports:
      # 仅绑回环，供本机初始化与 SecretRef 解析核验；不暴露到宿主网络之外。
      # 取用仍要 AppRole 凭据与策略，端口可达不等于 secret 可读。
      - "127.0.0.1:${OPENBAO_PORT:?必须显式提供，禁止硬编码}:8200"
    healthcheck:
      # 未初始化返回 501、已封存返回 503：两者都不算就绪。
      # 只有 200 才表示可取用 secret——SecretRef 不可读时 binding 不得 active。
      test: ["CMD-SHELL", "bao status -format=json >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40

  # namespace 是运行前提而非业务动作：它必须在 Core 连接之前存在。
  # 用 server 镜像而非 auto-setup 之后，这一步要显式做。
  # 走 internal-frontend（7236）——那是 Temporal 为内部组件保留的入口，
  # 与系统 Worker 同一条路径；公开 frontend 留给受令牌约束的业务调用。
  temporal-namespace:
    image: temporalio/admin-tools@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    networks: [component]
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7236
      NAMESPACE: ${TEMPORAL_NAMESPACE:?必须显式提供，禁止硬编码}
      RETENTION: ${TEMPORAL_RETENTION:?必须显式提供，禁止硬编码}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # 已存在即视为成立：注册是幂等的运行前提，不是一次性迁移
        if temporal operator namespace describe --namespace "$$NAMESPACE" >/dev/null 2>&1; then
          echo "namespace $$NAMESPACE 已存在"
        else
          temporal operator namespace create --namespace "$$NAMESPACE" --retention "$$RETENTION"
          echo "namespace $$NAMESPACE 已创建，retention=$$RETENTION"
        fi
        # 新建的 namespace 要等 Server 的 namespace 缓存刷新后才可见；在那之前
        # 登记 Search Attribute 会报 not found。等它可见，超时即失败而不是跳过。
        visible=no
        for _ in $$(seq 1 30); do
          if temporal operator search-attribute list --namespace "$$NAMESPACE" >/dev/null 2>&1; then visible=yes; break; fi
          sleep 2
        done
        [ "$$visible" = yes ] || { echo "namespace $$NAMESPACE 在超时内不可见" >&2; exit 1; }
        # 固定登记三个 Keyword Search Attribute（.design/06 §3）。逐个判定已存在
        # 再建：重复创建会报错，而它是幂等的运行前提。
        # ADR-17 迁移窗口内另登记三个旧名：它们只读不写，让「按 SA 列举新旧两组」在
        # 新建的 namespace 上同样成立；窗口关闭时从这里删去旧名三项，已有 namespace
        # 里的旧名注册原样保留、不再写入。
        for sa in PlatformTenantId PlatformWorkspaceId PlatformWorkflowKind \
                  KailoTenantId KailoWorkspaceId KailoWorkflowKind; do
          if temporal operator search-attribute list --namespace "$$NAMESPACE" | grep -qw "$$sa"; then
            echo "search attribute $$sa 已存在"
          else
            temporal operator search-attribute create --namespace "$$NAMESPACE" --name "$$sa" --type Keyword
          fi
        done
    restart: "no"

  # schema 是运行前提：SpiceDB 启动时是空 schema，写 relationship 会失败。
  # 与 Temporal 的 namespace、Relay 的 migrate 同一形态——建面与启动分离。
  # 只能经 gRPC WriteSchema 写入（spicedb 二进制没有读 .zed 文件的子命令），
  # 因此用官方 zed CLI；它本身是幂等的全量写入。
  spicedb-schema:
    image: authzed/zed@sha256:075810514ce2b5b494240b8015dd1ee686b47c00e238a5925eaf5f5fe3c8d02e
    networks: [component]
    depends_on:
      spicedb: { condition: service_healthy }
    # PSK 经 env_file 投递；ZED_TOKEN 不上命令行（SF-SPZ-04 的同一理由）。
    env_file:
      - ./secrets/zed.env
    environment:
      ZED_ENDPOINT: spicedb:50051
      ZED_INSECURE: "true"
    configs:
      - source: spicedb_schema
        target: /etc/spicedb/schema.zed
    command: ["schema", "write", "/etc/spicedb/schema.zed"]
    restart: "no"

  # Keycloak 是 OIDC 的默认实现（.design/01 §2：OIDC 是可替换认证契约）。
  # 它同时承担两件事：人类登录，以及 Core/Worker 以 client_credentials 取得
  # 面向 Temporal 的服务令牌——Temporal 的 default claim mapper 从 permissions
  # 声明读取 "<namespace>:<role>"（SF-TMP-06）。
  keycloak:
    image: quay.io/keycloak/keycloak@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    # 带点的别名：HTTP 客户端的 cookie 引擎普遍不为单标签主机名保存或发送
    # cookie，OIDC 浏览器流会因此在本地拓扑里断掉。真实部署用 FQDN 不会遇到，
    # 本地也应保持同一形状，否则接缝在本地验不了。
    networks:
      edge:
        aliases: ["${OIDC_HOST:?必须显式提供，禁止硬编码}"]
      app:
        aliases: ["${OIDC_HOST:?必须显式提供，禁止硬编码}"]
      component:
        aliases: ["${OIDC_HOST:?必须显式提供，禁止硬编码}"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?必须显式提供，禁止硬编码}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    secrets: [keycloak_admin_password]
    volumes:
      # 持久卷挂在镜像已有且属 keycloak 用户的 data 目录：空卷首次挂载时继承该属主，
      # H2 在其中的 h2/ 子目录；挂到镜像里不存在的路径时新卷根属 root，Keycloak 无法写入。
      - keycloak-data:/opt/keycloak/data
      - ./secrets/idp-import:/opt/keycloak/data/import:ro
    # 口令从 secret 挂载读入后导出：Keycloak 不支持 _FILE 变体，
    # 直接写进 environment 会让它出现在 compose 与 .env 里。
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    ports:
      - "${PUBLIC_BIND_ADDR:?必须显式提供公开入口发布地址}:${KEYCLOAK_PORT:?必须显式提供，禁止硬编码}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  # SpiceDB 是关系授权权威。07 §1 不变式：preshared key 经环境变量或文件投递，
  # 不用命令行 flag——flag 在启用 tracing 时会随 OTel resource 导出（SF-SPZ-04）。
  # SpiceDB 是访问允许/拒绝的权威（03 §1），relationship 必须跨重启存活：
  # memory datastore 重启即清空，而 Core 的 projection 记录仍说「已投影」，
  # 两边对不上账且无法收敛（DD-41/45 的对账前提失效）。与 Temporal、Relay
  # 一样自持一个库，不与 Core 业务库共用。
  spicedb-db:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    networks: [spicedb-data]
    environment:
      POSTGRES_DB: ${SPICEDB_DB_NAME:?必须显式提供，禁止硬编码}
      POSTGRES_USER: ${SPICEDB_DB_USER:?必须显式提供，禁止硬编码}
      POSTGRES_PASSWORD_FILE: /run/secrets/spicedb_db_password
    secrets: [spicedb_db_password]
    volumes:
      - spicedb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 数据库迁移与 schema 写入是两件事：前者建 SpiceDB 自己的表，后者写平台
  # 的 object type 定义。迁移先于 serve，schema 后于 serve。
  spicedb-migrate:
    image: authzed/spicedb@sha256:aa96009a0477f8a759149823407d47ad16d1a74390bae3102b3b0b7143502764
    networks: [spicedb-data]
    depends_on:
      spicedb-db: { condition: service_healthy }
    env_file:
      - ./secrets/spicedb.env
    command: ["datastore", "migrate", "head"]
    restart: "no"

  spicedb:
    image: authzed/spicedb@sha256:aa96009a0477f8a759149823407d47ad16d1a74390bae3102b3b0b7143502764
    networks: [component, app, spicedb-data]
    depends_on:
      spicedb-migrate: { condition: service_completed_successfully }
    environment:
      SPICEDB_OTEL_PROVIDER: none
      # HTTP gateway 供 Core 做 fresh Check（ADR-10）：它是同一套 PermissionsService
      # 的 grpc-gateway 投影，同一枚 preshared key 认证。只在 app/component 网络内
      # 可达，不发布到宿主。
      SPICEDB_HTTP_ENABLED: "true"
      SPICEDB_HTTP_ADDR: ":${SPICEDB_HTTP_CONTAINER_PORT:?必须显式提供，禁止硬编码}"
    # key 与连接串经 env_file 以环境变量投递，不作为命令行 flag——flag 在启用
    # tracing 时会随 OTel resource 导出（SF-SPZ-04、07 §1）。该文件在 secrets/ 下，
    # 由 bootstrap.sh 生成并被 gitignore；镜像是 distroless，无法用入口脚本读取挂载。
    env_file:
      - ./secrets/spicedb.env
    command: ["serve"]
    ports:
      # 仅绑回环，供本机对投影链路做查证；不暴露到宿主网络之外。
      - "127.0.0.1:${SPICEDB_PORT:?必须显式提供，禁止硬编码}:50051"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 5s
      retries: 20

secrets:
  openmeter_db_password:
    file: ./secrets/openmeter_db_password
  openmeter_clickhouse_password:
    file: ./secrets/openmeter_clickhouse_password
  openmeter_core_token:
    file: ./secrets/openmeter_core_token
  buzz_db_password:
    file: ./secrets/buzz_db_password
  agentgateway_db_password:
    file: ./secrets/agentgateway_db_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  temporal_db_password:
    file: ./secrets/temporal_db_password
  spicedb_db_password:
    file: ./secrets/spicedb_db_password
  core_db_password:
    # 开发用 secret 也经受控投递面取得，不在仓库、环境文件或脚本中出现明文
    # （07 §2）。该文件由 deploy/local/bootstrap.sh 从受控来源生成。
    file: ./secrets/core_db_password

configs:
  # 唯一原生去重配置由 .env 投影，API 与 sink 共用真正的 YAML bool/整数。
  # 启用与 driver 是既定要求，不以可关闭开关绕过；两阶段索引严格分库。
  openmeter_usage_config:
    content: |
      dedupe:
        enabled: true
        driver: redis
        config:
          address: "openmeter-dedupe:${OPENMETER_REDIS_PORT:?必须显式提供，禁止硬编码}"
          database: ${OPENMETER_INGRESS_DEDUPE_DATABASE:?必须显式提供，禁止硬编码}
          expiration: "${OPENMETER_DEDUPE_EXPIRATION:?必须显式提供，禁止硬编码}"
          mode: rawkey
      sink:
        kafka:
          brokers: openmeter-kafka:9092
        dedupe:
          enabled: true
          driver: redis
          config:
            address: "openmeter-dedupe:${OPENMETER_REDIS_PORT:?必须显式提供，禁止硬编码}"
            database: ${OPENMETER_SINK_DEDUPE_DATABASE:?必须显式提供，禁止硬编码}
            expiration: "${OPENMETER_DEDUPE_EXPIRATION:?必须显式提供，禁止硬编码}"
            mode: rawkey
  spicedb_schema:
    file: ./authorization/schema.zed
  agentgateway_config:
    file: ./model-gateway-config.yaml
  openbao_config:
    file: ./secret-store-config.hcl
  otel_config:
    file: ./telemetry-collector.yaml
  temporal_dynamic_config:
    file: ./workflow-engine-dynamicconfig.yaml
  temporal_config:
    file: ./workflow-engine-config.yaml
