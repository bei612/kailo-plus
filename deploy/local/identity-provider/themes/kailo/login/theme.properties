# Kailo IdP login theme (DD-164(8), DD-141, .design/20). Layout and behaviour stay the IdP's
# own keycloak.v2 login pages; only presentation and wording change. Delivered read-only by
# deploy/local/compose.yaml (configs), selected by the realm's loginTheme through the
# declarative realm-presentation step. Resources the theme does not ship fall back to the parent.
parent=keycloak.v2
import=common/keycloak

# kailo-theme-tokens.css is client-kit/embed/kailo-theme-tokens.css (the generated Kailo tokens),
# mounted as a deployment config so the login page shares the single token source.
styles=css/kailo-theme-tokens.css css/styles.css css/kailo.css
scripts=js/kailo-theme.js
darkMode=true
