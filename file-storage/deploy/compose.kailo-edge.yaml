# Kailo entry topology (DD-164(10), .design/07 §4.6): browsers reach this Cells origin
# only through the Kailo gateway's component listener, which forwards to the alias
# below on the existing platform edge network. Added by start.sh only when
# CELLS_EDGE_NETWORK is set; the native port itself is published on loopback only.
services:
  cells:
    networks:
      kailo-edge:
        aliases: [kailo-edge-file-storage]

networks:
  kailo-edge:
    external: true
    name: ${CELLS_EDGE_NETWORK:?existing platform edge network required}
