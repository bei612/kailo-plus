; Kailo document-editor process set (DD-132(1)). 9.4 community runs the
; converter inside DocService (Common/sources/runtime/profile.js
; isMemoryRuntime, DocService/sources/embeddedConverter.js), so only DocService
; and nginx run; both log to the container stream.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/kailo-ds/supervisord.pid

[unix_http_server]
file=/run/kailo-ds/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/kailo-ds/supervisor.sock

[program:docservice]
command=/usr/local/bin/node /var/www/onlyoffice/documentserver/server/DocService/sources/server.js
directory=/var/www/onlyoffice/documentserver/server/DocService
user=ds
environment=NODE_ENV="production-linux",NODE_CONFIG_DIR="/run/kailo-ds/config",NODE_DISABLE_COLORS="1",APPLICATION_NAME="onlyoffice",HOME="/var/lib/onlyoffice"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30

[program:nginx]
command=/usr/sbin/nginx -c /etc/nginx/nginx.conf -g "daemon off;"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autostart=true
autorestart=true
