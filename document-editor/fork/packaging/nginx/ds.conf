include /etc/nginx/includes/http-common.conf;
server {
  listen 0.0.0.0:80 default_server;
  server_tokens off;

  # Written by kailo-ds-entrypoint at every start into the runtime tmpfs:
  # the cache-file signing secret (owner-only secret file) and the exact
  # frame-ancestors of DS_FRAME_ANCESTORS. Missing either file = nginx refuses.
  include /run/kailo-ds/nginx/secure-link.conf;
  include /run/kailo-ds/nginx/frame-ancestors.conf;
  # Fixed per build (Dockerfile): equals the hash in api.js.
  include /etc/nginx/includes/ds-cache.conf;
  include /etc/nginx/includes/ds-common.conf;
  include /etc/nginx/includes/ds-mime.types.conf;
  include /etc/nginx/includes/ds-docservice.conf;
}
