# Kailo document-editor nginx (DD-132(3)). Derived from the official 9.4.0-129
# package layout (/etc/nginx/nginx.conf + conf.d/ds.conf); only this server is
# loaded: no default site, no example, no admin panel, no SSL/letsencrypt.
user www-data;
worker_processes auto;
pid /run/kailo-ds/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 768;
}

http {
  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  include /etc/nginx/conf.d/ds.conf;
}
