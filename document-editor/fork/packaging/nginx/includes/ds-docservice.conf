# Official 9.4.0-129 includes/ds-docservice.conf with the Kailo changes of
# DD-132(3): no welcome page, no plugin or AI proxy routes, and the exact
# frame-ancestors header repeated in every location that sets its own headers
# (nginx does not inherit add_header into such a location).

location = / { return 404; }

#script caching protection
location ~ ^(?<cache>\/web-apps\/apps\/(?!api\/documents\/api\.js$).*)$ {
  return 302 $the_scheme://$the_host$the_prefix/@PRODUCT_VERSION@-$cache_tag$cache$is_args$args;
}

#disable caching for api.js
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(web-apps\/apps\/api\/documents\/api\.js)$ {
  expires off;
  add_header Cache-Control "no-store, no-cache, must-revalidate";
  include /run/kailo-ds/nginx/frame-ancestors.conf;
  alias  /var/www/onlyoffice/documentserver/$2;
}

location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(document_editor_service_worker.js)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /run/kailo-ds/nginx/frame-ancestors.conf;
  alias  /var/www/onlyoffice/documentserver/sdkjs/common/serviceworker/$2;
}

#suppress logging the unsupported locale error in web-apps
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(web-apps)(\/.*\.json)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /run/kailo-ds/nginx/frame-ancestors.conf;
  error_log /dev/null crit;
  alias /var/www/onlyoffice/documentserver/$2$3;
}

location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(web-apps|sdkjs|fonts|dictionaries)(\/.*)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /run/kailo-ds/nginx/frame-ancestors.conf;
  alias /var/www/onlyoffice/documentserver/$2$3;
}

# DD-35: no plugins ship; the editor's plugin list is the fixed empty list
# that DocService itself returns for an empty plugin directory.
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(sdkjs-plugins)(\/.*)?$ { return 404; }
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/plugins\.json$ {
  default_type application/json;
  add_header Cache-Control "no-store" always;
  include /run/kailo-ds/nginx/frame-ancestors.conf;
  return 200 '{"url":"","pluginsData":[],"autostart":[]}';
}

# DD-35: ONLYOFFICE AI is not connected; the DocService AI proxy is unreachable.
location ~* ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(ai-proxy)(\/.*)?$ { return 404; }

location ~* ^(\/cache\/files.*)(\/.*) {
  alias /var/lib/onlyoffice/documentserver/App_Data$1;
  add_header Content-Disposition "attachment; filename*=UTF-8''$arg_filename";
  include /run/kailo-ds/nginx/frame-ancestors.conf;

  secure_link $arg_md5,$arg_expires;
  secure_link_md5 "$secure_link_expires$uri$secure_link_secret";

  if ($secure_link = "") {
    return 403;
  }

  if ($secure_link = "0") {
    return 410;
  }
}

# Allow "/internal" interface only from 127.0.0.1
location ~* ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(internal)(\/.*)$ {
  allow 127.0.0.1;
  deny all;
  proxy_pass http://docservice/$2$3;
}

# Allow "/info" interface only from 127.0.0.1
location ~* ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(info)(\/.*)$ {
  allow 127.0.0.1;
  deny all;
  proxy_pass http://docservice/$2$3;
}

#document formats discovery
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(meta\/formats)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /run/kailo-ds/nginx/frame-ancestors.conf;
  default_type application/json;
  alias /var/www/onlyoffice/documentserver/document-formats/onlyoffice-docs-formats.json;
}

location / {
  proxy_pass http://docservice;
  proxy_http_version 1.1;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_connect_timeout 300s;
  proxy_buffering on;
  proxy_buffers 64 32k;
  proxy_busy_buffers_size 64k;
  proxy_max_temp_file_size 0;
  proxy_redirect off;
}

location ~ ^/([\d]+\.[\d]+\.[\d]+[\.|-][\w]+)/(?<path>.*)$ {
  proxy_pass http://docservice/$path$is_args$args;
  proxy_http_version 1.1;
}
