# The implementation repository root owns the shared local/CI gate (ADR-07).
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Checkout directory name, not an apps/ subtree inside this repository.
        working-directory: apps

    services:
      core-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform_core_ci
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ${{ secrets.CI_CORE_DB_PASSWORD }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://platform:${{ secrets.CI_CORE_DB_PASSWORD }}@127.0.0.1:5432/platform_core_ci
      CHECK_SOURCE_REF: ${{ github.sha }}
      TMPDIR: ${{ vars.TMPDIR }}
      CHECK_CPUS: ${{ vars.CHECK_CPUS }}
      CHECK_MEMORY: ${{ vars.CHECK_MEMORY }}
      CHECK_NETWORK: ${{ vars.CHECK_NETWORK }}
      CHECK_CACHE_ROOT: ${{ vars.CHECK_CACHE_ROOT }}
      # These are CI execution inputs, not a second set of application settings.
      CI_BUILDKIT_CPU_QUOTA: ${{ vars.CI_BUILDKIT_CPU_QUOTA }}
      CI_BUILDKIT_CPU_PERIOD: ${{ vars.CI_BUILDKIT_CPU_PERIOD }}
      CI_BUILDKIT_MEMORY: ${{ vars.CI_BUILDKIT_MEMORY }}
      CI_BUILDKIT_CACHE_ROOT: ${{ vars.CI_BUILDKIT_CACHE_ROOT }}
      BUILDX_BUILDER: kailo-check-${{ github.run_id }}-${{ github.run_attempt }}
      # Separately reviewed authority retained on design-authority, not a
      # second design copy under the code root. Checkout fetches full history.
      DESIGN_COMMIT: 22b8beada030fb49df82c236ab69007a33d7701b

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: apps

      - name: Read the pinned design authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../.design
          git archive "${DESIGN_COMMIT}:.design" | tar -x -C ../.design

      - name: Prepare the bounded CI builder
        shell: bash
        run: |
          set -euo pipefail
          : "${TMPDIR:?Repository variable TMPDIR is required}"
          : "${CHECK_CPUS:?Repository variable CHECK_CPUS is required}"
          : "${CHECK_MEMORY:?Repository variable CHECK_MEMORY is required}"
          : "${CHECK_NETWORK:?Repository variable CHECK_NETWORK is required}"
          : "${CHECK_CACHE_ROOT:?Repository variable CHECK_CACHE_ROOT is required}"
          : "${CI_BUILDKIT_CACHE_ROOT:?Repository variable CI_BUILDKIT_CACHE_ROOT is required}"
          for value in CI_BUILDKIT_CPU_QUOTA CI_BUILDKIT_CPU_PERIOD CI_BUILDKIT_MEMORY; do
            [[ "${!value:-}" =~ ^[1-9][0-9]*$ ]] || {
              echo "$value must be a positive integer (memory in bytes)" >&2; exit 2;
            }
          done
          for path in "$TMPDIR" "$CHECK_CACHE_ROOT" "$CI_BUILDKIT_CACHE_ROOT"; do
            path=$(realpath -m -- "$path")
            case "$path" in /volumes/data/*) ;; *) echo 'CI data paths must be under /volumes/data' >&2; exit 2 ;; esac
            if [ ! -d "$path" ]; then
              sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" -- "$path"
            fi
            [ -w "$path" ] || { echo "CI data directory is not writable: $path" >&2; exit 2; }
          done
          source tools/container-safety.sh
          container_safety_init
          container_resource_preflight
          cache=$(container_require_data_path "$CI_BUILDKIT_CACHE_ROOT")
          volume="buildx_buildkit_${BUILDX_BUILDER}0_state"
          if "${CONTAINER_DOCKER[@]}" buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1 \
            || "${CONTAINER_DOCKER[@]}" volume inspect "$volume" >/dev/null 2>&1; then
            echo 'CI private builder or volume already exists; refusing to reuse unrelated resources' >&2
            exit 2
          fi
          "${CONTAINER_DOCKER[@]}" volume create --driver local --opt type=none --opt o=bind --opt "device=$cache" "$volume"
          printf 'CI_BUILDKIT_VOLUME_CREATED=%s\n' "$volume" >> "$GITHUB_ENV"
          "${CONTAINER_DOCKER[@]}" buildx create --name "$BUILDX_BUILDER" --node "${BUILDX_BUILDER}0" \
            --driver docker-container --driver-opt "cpu-quota=$CI_BUILDKIT_CPU_QUOTA" \
            --driver-opt "cpu-period=$CI_BUILDKIT_CPU_PERIOD" --driver-opt "memory=$CI_BUILDKIT_MEMORY" \
            --driver-opt "memory-swap=$CI_BUILDKIT_MEMORY" --bootstrap
          container_require_limited_builder
          actual=$("${CONTAINER_DOCKER[@]}" inspect "buildx_buildkit_${BUILDX_BUILDER}0" \
            --format '{{.HostConfig.CpuQuota}} {{.HostConfig.CpuPeriod}} {{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}')
          [ "$actual" = "$CI_BUILDKIT_CPU_QUOTA $CI_BUILDKIT_CPU_PERIOD $CI_BUILDKIT_MEMORY $CI_BUILDKIT_MEMORY" ] || {
            echo 'CI actual BuildKit limits differ from execution configuration' >&2; exit 2;
          }

      - name: tools/check.sh --full
        run: ./tools/check.sh --full

      - name: Remove this job's private builder
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f tools/container-safety.sh ] && [ -d "${TMPDIR:-}" ] || exit 0
          volume="buildx_buildkit_${BUILDX_BUILDER}0_state"
          [ "${CI_BUILDKIT_VOLUME_CREATED:-}" = "$volume" ] || exit 0
          source tools/container-safety.sh
          container_safety_init
          if "${CONTAINER_DOCKER[@]}" buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1; then
            "${CONTAINER_DOCKER[@]}" buildx rm "$BUILDX_BUILDER"
          fi
          if "${CONTAINER_DOCKER[@]}" volume inspect "$volume" >/dev/null 2>&1; then
            "${CONTAINER_DOCKER[@]}" volume rm "$volume"
          fi
