# 门禁只在 apps/tools/check.sh 里定义（ADR-07）。本工作流只负责调用它，
# 不在 YAML 中写任何门禁逻辑——两处行为出现差异即为缺陷。
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # 迁移演练需要真实 Postgres。版本与 deploy/local/compose.yaml 保持一致；
    # 两处漂移会让「本地通过 CI 不通过」变成环境问题而非变更问题。
    services:
      core-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kailo_core_ci
          POSTGRES_USER: kailo
          POSTGRES_PASSWORD: ${{ secrets.CI_CORE_DB_PASSWORD }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://kailo:${{ secrets.CI_CORE_DB_PASSWORD }}@127.0.0.1:5432/kailo_core_ci

    steps:
      - uses: actions/checkout@v4

      # Temporal Go SDK v1.48.0 的 go.mod 声明 Go >= 1.25.4；低于它时
      # Go 会静默下载并切换工具链，使 CI 实际使用的编译器版本不可控。
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/worker/go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.4'

      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: tools/check.sh --full
        working-directory: apps
        run: ./tools/check.sh --full
