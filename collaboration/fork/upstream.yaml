# 来源记录，格式见 apps/06-工程基线规范.md §2。字段含义冲突时以该节为准。
# 本目录（fork/）之外的整棵树是上游固定 commit 的完整源码，本仓库的改动直接在树里；与上游原样的
# 差异由 `tools/upstream_manifest.py diff <项目>` 给出，上游的新变化由 `status` 提示、`sync` 合并
# （ADR-16）。产物字段里的路径一律相对 apps/。
project: collaboration
reference_tree: buzz
upstream_url: https://github.com/block/buzz

# 协作底座：一棵树、三个交付面（DD-74）。Relay（crates/，含 buzz-admin）、Desktop 客户端
# （desktop/，Tauri）与 Mobile 客户端（mobile/，Flutter）同在上游这个 monorepo，基准 commit 相同。
# Relay：Community 的治理要求 Relay 只接受 owner（Tenant CONTROL）签发的管理类事件
# （SS-BUZ-GOVERNANCE、DD-80），上游没有这个开关（SF-BUZ-37）；同一开关设定时 Relay 还关闭
# 上游自带 workflow（DD-106、SF-BUZ-45）。因此不能用上游发布的镜像，由本树构建。
evidence_commit: 779af8886caae1317b4de962082429867ab61503
implementation_base_commit: 779af8886caae1317b4de962082429867ab61503
base_divergence: none

# 相对固定上游树当前缺失／已迁出的路径事实，不是裁减产品范围的授权。
# REQ-24 要求恢复原版页面、布局、菜单、设置与交互，同时保留治理调用链。
# 迁到 client-kit 的原实现由 Web/Desktop 共用；其余尚未恢复的路径仍是交付缺口，
# 不得以本清单将 Agent、Workflow、Huddle、Projects、DM、Terminal 或设置排除出范围。
# Mobile 的宿主边界仍按设计执行，不通过内嵌业务组件绕过。
# 与实际一致由 `upstream_manifest.py diff collaboration --check` 核对。
