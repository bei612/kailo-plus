# Desktop 以 file: 副本依赖引用 client-kit/ts（BFF 客户端、平台页、原生登录引导与文案，ADR-09/18），传输是
# 经 Tauri `platform_api` 的实现（native.ts）；Mobile 以 Flutter path: 依赖引用 client-kit/dart（契约
# Dart 生成物与平台文案，ADR-02/03）。两者都在各自产物的 inputs 里，改了即要求重建。
artifacts:
  # Relay 与 buzz-admin 镜像：上游根 Dockerfile，其 .dockerignore 整个排除 desktop/ 与 mobile/。
  - name: collaboration-relay
    kind: image
    build_context: collaboration
    build_dockerfile: collaboration/Dockerfile
    inputs: [collaboration/]
    exclude: [collaboration/desktop/, collaboration/mobile/, collaboration/fork/packaging/]
    source_digest: sha256:962c5c935125cdd79f83f9c2af1d2bfa68ab78b09ad88c69f13a265b04c0bec7
    artifact_digest: sha256:c5a484b74e75d24de8f65cab625aa76b3319434bf5d34ffca6821dd39ca5ca30
  # Windows x64 NSIS 测试安装包：官方 Tauri cargo-xwin 同主体交叉打包，不作为带签名正式发布。
  # artifact_digest 记安装包字节的 SHA-256（06 §2）。mobile/ 与 crates/buzz-relay/ 不是它的输入：
  # desktop/src-tauri 不在根 Cargo workspace 内，其 Cargo.lock 不含 buzz-relay；pnpm workspace
  # 只有 desktop、web、admin-web。
  - name: desktop-client
    kind: bundle
    build_context: .
    build_dockerfile: collaboration/fork/packaging/desktop.windows.Dockerfile
    inputs: [collaboration/, client-kit/ts/contracts/, client-kit/ts/platform/]
    exclude: [collaboration/mobile/, collaboration/crates/buzz-relay/, collaboration/fork/packaging/mobile.Dockerfile, collaboration/fork/packaging/mobile.Dockerfile.dockerignore]
    # 安装包显示名由发布配置注入（DD-111），不写在源码里
    build_args: [PLATFORM_DISPLAY_NAME]
    blocked: Win11 x64 unsigned 测试安装包已生成；代码签名、Win11 安装运行与业务验收未完成
    source_digest: sha256:374cde80c5de98b66a36e3f7f006e35df4919337220d5b1497ab3ddc7db87e17
    artifact_digest: sha256:53d3b927fd0fd18b197299e9edd7cb73df65b7d32c68ac00e35b8b6901d511c7
  # Android release APK（ADR-06 客户端发布单元按端分离：应用商店包，带平台签名）。
  # 阻断：release 签名所需的 upload keystore 未提供。上游 release 构建缺 keystore 即失败，
  # 不以 debug 证书冒充 release；profile/debug APK 只是测试构建，不登记为发布产物。
  - name: mobile-client
    kind: bundle
    build_context: .
    build_dockerfile: collaboration/fork/packaging/mobile.Dockerfile
    inputs: [collaboration/mobile/, client-kit/dart/, collaboration/fork/packaging/mobile.Dockerfile, collaboration/fork/packaging/mobile.Dockerfile.dockerignore]
    build_secrets: [BUZZ_ANDROID_UPLOAD_KEYSTORE, BUZZ_ANDROID_UPLOAD_KEYSTORE_PASSWORD, BUZZ_ANDROID_UPLOAD_KEY_ALIAS, BUZZ_ANDROID_UPLOAD_KEY_PASSWORD]
    build_args: [PLATFORM_DISPLAY_NAME]
    blocked: release 签名 upload keystore 未提供（ADR-06 按端分离的 Mobile 发布链）
    source_digest: none
    artifact_digest: none

