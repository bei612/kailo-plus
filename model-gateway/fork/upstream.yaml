# 差异由 `tools/upstream_manifest.py diff <项目>` 给出，上游的新变化由 `status` 提示、`sync` 合并
# （ADR-16）。产物字段里的路径一律相对 apps/。
project: model-gateway
reference_tree: agentgateway
upstream_url: https://github.com/agentgateway/agentgateway

# .design/02 §1 固定基线。该 commit 在 v1.6.0-alpha.1 之后 65 个提交，没有任何 tag 包含它，
# 因此没有官方镜像。不退回 v1.6.0-alpha.1：SS-AGW-OIDC 的 logout 同步半边依赖
# crates/agentgateway/src/http/oidc/browser.rs::handle_logout，而该文件在 v1.6.0-alpha.1 上不存在。
# 退回发布版会让 Stage 1 退出门禁里的「logout 端到端通过」失去源码基础，因此从固定 commit
# 自行构建，evidence 与 implementation base 保持相等。
evidence_commit: 1f7ebbf87cbdbe9517f6f181221879d04dc50692
implementation_base_commit: 1f7ebbf87cbdbe9517f6f181221879d04dc50692
base_divergence: none

# 本仓库的改动：admin router 整体只接受 Core 的 client_credentials JWT（SS-AGW-ADMIN），见
# fork/verify/admin-authentication.md；完成请求的 LLM 记录与 request log 同事务进入 durable usage
# outbox，写库失败保留重试而不清批次，并经已认证的 admin 接口按游标读取（SS-AGW-USAGE），见
# fork/verify/durable-usage.md。后者的读取接口依赖前者的认证。
# jwtAuth 令牌位于 Proxy-Authorization 时失败以 407 拒绝（与上游 basic auth 一致），供 call_webhook
# 出站网关区分"网关拒绝 Core"与目标响应，见 fork/verify/proxy-jwt-407.md。
# 浏览器 logout 可选 RP-Initiated Logout（logout.endSession，SS-AGW-END-SESSION、DD-133(6)）：
# 有可解开的会话时 303 到 discovery 的 end_session_endpoint 并带 id_token_hint，见
# fork/verify/end-session.md。

