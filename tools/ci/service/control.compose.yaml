# kailo-ci-control: the client endpoint `kailo-ci` execs into (docker --context kailo-ci exec kailo-ci-control ...).
# Runs on the Kailo dockerd; only mounts the CI code, config and handoff (read-only), queue and artifacts.
name: kailo-ci
services:
  control:
    container_name: kailo-ci-control
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    restart: unless-stopped
    user: "1000:1000"
    environment:
      KAILO_CI_CONFIG: /volumes/kailo/ci/config.json
      KAILO_CI_HANDOFF: /volumes/kailo/ci/handoff/handoff.json
    volumes:
      - /volumes/kailo/ci/service:/ci:ro
      - /volumes/kailo/ci/config.json:/volumes/kailo/ci/config.json:ro
      # directory mount: handoff.json may be replaced atomically (rename) and the container still sees the new file
      - /volumes/kailo/ci/handoff:/volumes/kailo/ci/handoff:ro
      - /var/lib/kailo-ci/queue:/var/lib/kailo-ci/queue
      - /var/lib/kailo-ci/artifacts:/var/lib/kailo-ci/artifacts:ro
    network_mode: none
    # Each `kailo-ci status|list|wait` is a python3 client.py process here (~18 MB); with a dozen agents polling, 256m
    # hit its limit and the container re-read its files from disk at ~140 MB/s (2026-11-14, OPS-03), slowing the
    # whole node and hanging the clients. 768m covers ~40 concurrent clients.
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.5
