# Kailo CI shared Rust compile cache for the image builds: sccache's WebDAV backend (SCCACHE_WEBDAV_ENDPOINT) on
# nginx's dav module, rendered by setup.sh (@...@ placeholders). Builds reach it as kailo-macro KAILO_SCCACHE_WEBDAV;
# entries are content-addressed by sccache (compiler, flags, sources), so a stale entry is never served for other
# input. Size is kept by the hot-retention policy (dep-cache/sccache root, least recently used first).
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    log_format sccache '$time_iso8601 $status $request_method $body_bytes_sent $request_uri';
    access_log /dev/stdout sccache;
    client_body_temp_path /var/cache/kailo-sccache/.tmp;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;

    server {
        listen @BIND@:@PORT@;
        root /var/cache/kailo-sccache/data;
        client_max_body_size 2g;

        location = /healthz { return 200 "ok\n"; }

        location / {
            dav_methods PUT DELETE MKCOL;
            create_full_put_path on;
            dav_access user:rw group:r;
            autoindex off;
        }
    }
}
