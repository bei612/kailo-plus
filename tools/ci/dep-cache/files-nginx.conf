# Kailo CI file cache: apt archives and pinned release downloads of the image builds, rendered by setup.sh (@...@
# placeholders). Builds reach it as FILES_MIRROR / DEBIAN_MIRROR (kailo-macro KAILO_FILES_MIRROR, KAILO_DEBIAN_MIRROR):
#   http://@BIND@:@PORT@/debian/, /debian-security/   Debian archives (main, updates, security)
#   http://@BIND@:@PORT@/<host>/<path>                https://<host>/<path> for the hosts listed below
# Release files are versioned URLs and kept; mutable indexes (apt dists/, rust channel manifests) are revalidated and
# served stale when the upstream fails. Content is unchanged: apt verifies the archive signatures, the builds verify
# their pinned checksums.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    log_format files '$time_iso8601 $status $upstream_cache_status "$upstream_addr" $request_uri';
    access_log /dev/stdout files;
    client_body_temp_path /tmp/client;
    proxy_temp_path /var/cache/kailo-files/tmp;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_cache_path /var/cache/kailo-files/index levels=1:2 keys_zone=index:32m max_size=@INDEX_MAX@ inactive=365d use_temp_path=off;
    proxy_cache_path /var/cache/kailo-files/blobs levels=1:2 keys_zone=blobs:64m max_size=@FILES_MAX@ inactive=3650d use_temp_path=off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 20s;
    proxy_read_timeout 300s;
    # Large release archives are written to the cache as they stream; one upstream fetch per URL at a time.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 600s;
    proxy_cache_lock_age 600s;
    # A fetch that started completes into the cache even when the build that asked gave up (slow release hosts).
    proxy_ignore_client_abort on;
    proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
    # GitHub's redirects carry a signed asset URL and long security headers, beyond the default 4k header buffer.
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;
    resolver @RESOLVER@ valid=300s ipv6=off;
    resolver_timeout 10s;

    server {
        listen @BIND@:@PORT@;

        location = /healthz { return 200 "ok\n"; }

        # Debian: signed indexes revalidated every 10 minutes, pool files kept.
        location ^~ /debian/dists/ {
            proxy_pass @DEBIAN_UPSTREAM@dists/;
            proxy_cache index;
            proxy_cache_key "debian$request_uri";
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
        }
        location ^~ /debian/ {
            proxy_pass @DEBIAN_UPSTREAM@;
            proxy_cache blobs;
            proxy_cache_key "debian$request_uri";
            proxy_cache_valid 200 3650d;
        }
        location ^~ /debian-security/dists/ {
            proxy_pass @SECURITY_UPSTREAM@dists/;
            proxy_cache index;
            proxy_cache_key "debian-security$request_uri";
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
        }
        location ^~ /debian-security/ {
            proxy_pass @SECURITY_UPSTREAM@;
            proxy_cache blobs;
            proxy_cache_key "debian-security$request_uri";
            proxy_cache_valid 200 3650d;
        }

        # Rust channel manifests by channel name move; versioned ones (channel-rust-1.94.0.toml) do not.
        location ~ ^/static\.rust-lang\.org/(dist/channel-rust-(stable|beta|nightly)[^/]*|rustup/(release-stable\.toml|dist/.*))$ {
            set $host_part static.rust-lang.org;
            set $path_part $1;
            proxy_pass https://static.rust-lang.org/$path_part;
            proxy_cache index;
            proxy_cache_key "$host_part/$path_part";
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        }

        # Pinned release downloads. GitHub answers release and archive URLs with a redirect to a signed, short-lived
        # asset URL: nginx follows it itself and keeps the file under the original URL.
        location ~ ^/(@FILE_HOSTS_RE@)/(.+)$ {
            set $host_part $1;
            set $path_part $2;
            proxy_pass https://$host_part/$path_part$is_args$args;
            proxy_cache blobs;
            proxy_cache_key "$host_part/$path_part$is_args$args";
            proxy_cache_valid 200 3650d;
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @redirect;
        }
        location @redirect {
            set $location_target $upstream_http_location;
            proxy_pass $location_target;
            proxy_cache blobs;
            proxy_cache_key "$host_part/$path_part$is_args$args";
            proxy_cache_valid 200 3650d;
            proxy_intercept_errors on;
            recursive_error_pages on;
            error_page 301 302 303 307 308 = @redirect;
        }

        location / { return 404 "not a cached host\n"; }
    }
}
