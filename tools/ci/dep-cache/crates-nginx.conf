# Kailo CI crates.io cache (OPS-03): sparse index + crate files, rendered by setup.sh (@...@ placeholders).
# Cargo uses it as a source replacement: sparse+http://127.0.0.1:@PORT@/index/ (kailo-macro KAILO_CARGO_MIRROR).
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    log_format crates '$time_iso8601 $status $upstream_cache_status "$upstream_addr" $request_uri';
    access_log /dev/stdout crates;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_cache_path /var/cache/kailo-crates/index levels=1:2 keys_zone=index:64m max_size=@INDEX_MAX@ inactive=365d use_temp_path=off;
    proxy_cache_path /var/cache/kailo-crates/files levels=1:2 keys_zone=files:64m max_size=@FILES_MAX@ inactive=3650d use_temp_path=off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 20s;
    # Crate URLs are built per request, so nginx resolves the upstream hosts itself: the host's resolver.
    resolver @RESOLVER@ valid=300s ipv6=off;
    resolver_timeout 10s;
    proxy_read_timeout 120s;

    server {
        listen 127.0.0.1:@PORT@;
        # Downloads come back here, keyed by crate and version.
        location = /index/config.json {
            default_type application/json;
            return 200 '{"dl":"http://127.0.0.1:@PORT@/crates/{crate}/{version}.crate","api":"https://crates.io"}';
        }
        location /index/ {
            proxy_pass @INDEX_UPSTREAM@;
            proxy_cache index;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
        }
        location ~ ^/crates/([^/]+)/([^/]+)\.crate$ {
            set $crate $1;
            set $version $2;
            proxy_pass @DL_UPSTREAM@$crate/$version.crate;
            proxy_cache files;
            proxy_cache_key "crate/$crate/$version";
            proxy_cache_valid 200 3650d;
            proxy_cache_lock on;
            proxy_intercept_errors on;
            error_page 403 404 500 502 503 504 = @origin;
        }
        # The mirror lacks a crate or fails: crates.io itself (same cache key).
        location @origin {
            proxy_pass https://static.crates.io/crates/$crate/$crate-$version.crate;
            proxy_cache files;
            proxy_cache_key "crate/$crate/$version";
            proxy_cache_valid 200 3650d;
            proxy_cache_lock on;
        }
    }
}
