# Kailo CI Hugging Face Hub cache, rendered by setup.sh (@...@ placeholders). Builds reach it as an HF_ENDPOINT
# (kailo-macro KAILO_HF_MIRROR=http://@BIND@:@PORT@): huggingface_hub's repo_info / list_repo_tree (/api/...) and
# file downloads (/<repo>/resolve/<revision>/<path>, models, datasets and spaces).
#
# Two servers. The public one is only a cache. Behind it (unix socket) the hub server talks to @HF_ORIGIN@ and follows
# every redirect itself: the Hub answers resolve with a relative redirect (/api/resolve-cache/...) for small files and an
# absolute one to its CDN for LFS/Xet files, and a mirror may redirect to the Hub first. huggingface_hub reads the
# file's commit, ETag and size from the Hub's own response (X-Repo-Commit, X-Linked-Etag, X-Linked-Size), which a CDN
# response lacks: the hub server keeps the first value it saw on the way and adds it to the final response, so the
# cached answer carries it. The Xet headers and links (X-Xet-*, Link rel="xet-auth") are dropped and the tree
# listing's "xetHash" is renamed, so clients download over plain HTTP from this cache and never contact the Xet CAS;
# pagination links (Link rel="next") are rewritten to this cache.
# Files under a 40-hex commit id never change and are kept; branch and tag revisions and the API are revalidated every
# 10 minutes and served stale when the upstream fails. HEAD requests are answered from the cache when it has the file
# and passed through (not stored) otherwise, so huggingface_hub's metadata HEAD never waits for a whole model file.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    log_format hf '$time_iso8601 $status $upstream_cache_status "$upstream_addr" $request_method $request_uri';
    access_log /dev/stdout hf;
    client_body_temp_path /tmp/client;
    proxy_temp_path /var/cache/kailo-hf/tmp;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_cache_path /var/cache/kailo-hf/api levels=1:2 keys_zone=hf_api:32m max_size=@API_MAX@ inactive=365d use_temp_path=off;
    proxy_cache_path /var/cache/kailo-hf/files levels=1:2 keys_zone=hf_files:64m max_size=@FILES_MAX@ inactive=3650d use_temp_path=off;
    proxy_http_version 1.1;
    proxy_connect_timeout 20s;
    proxy_read_timeout 300s;
    resolver @RESOLVER@ valid=300s ipv6=off;
    resolver_timeout 10s;

    # Redirect following: the next hop (an absolute Location as is, a relative one against the origin of the hop that
    # sent it) and the Hub headers seen so far (the first non-empty value of each). volatile: re-evaluated on every hop.
    map "$hf_origin|$upstream_http_location" $hf_target {
        volatile;
        "~^[^|]*\|(?<hf_abs>https?://.+)$" $hf_abs;
        "~^(?<hf_o>[^|]*)\|(?<hf_rel>/.*)$" "$hf_o$hf_rel";
        default "";
    }
    map $hf_next $hf_next_origin {
        volatile;
        "~^(?<hf_no>https?://[^/]+)" $hf_no;
        default "";
    }
    map "$hf_seen_commit|$upstream_http_x_repo_commit" $hf_seen_commit_next {
        volatile;
        "~^(?<hf_c1>[^|]+)\|" $hf_c1;
        "~^\|(?<hf_c2>.*)$" $hf_c2;
        default "";
    }
    map "$hf_seen_etag|$upstream_http_x_linked_etag" $hf_seen_etag_next {
        volatile;
        "~^(?<hf_e1>[^|]+)\|" $hf_e1;
        "~^\|(?<hf_e2>.*)$" $hf_e2;
        default "";
    }
    map "$hf_seen_size|$upstream_http_x_linked_size" $hf_seen_size_next {
        volatile;
        "~^(?<hf_s1>[^|]+)\|" $hf_s1;
        "~^\|(?<hf_s2>.*)$" $hf_s2;
        default "";
    }
    # The final response's own value wins; otherwise the one seen on the way.
    map $upstream_http_x_repo_commit $hf_commit_out { volatile; "" $hf_seen_commit; default $upstream_http_x_repo_commit; }
    map $upstream_http_x_linked_etag $hf_etag_out { volatile; "" $hf_seen_etag; default $upstream_http_x_linked_etag; }
    map $upstream_http_x_linked_size $hf_size_out { volatile; "" $hf_seen_size; default $upstream_http_x_linked_size; }
    # Only pagination survives, pointed at this cache (huggingface_hub follows rel="next" as an absolute URL).
    map $upstream_http_link $hf_link {
        volatile;
        "~^(?<hf_lp>[^<]*<)https?://[^/>]+(?<hf_lr>/api/[^>]*>; *rel=\"next\".*)$" "${hf_lp}http://@BIND@:@PORT@${hf_lr}";
        default "";
    }
    map $request_method $hf_is_head { HEAD 1; default ""; }

    # The cache.
    server {
        listen @BIND@:@PORT@;

        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires X-Accel-Redirect;
        proxy_cache_convert_head off;
        proxy_no_cache $hf_is_head;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 1800s;
        proxy_cache_lock_age 1800s;
        # A fetch that started completes into the cache even when the client gave up.
        proxy_ignore_client_abort on;
        proxy_read_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        # Stored as the upstream sends it with identity encoding, whatever encoding the first client accepted.
        proxy_set_header Accept-Encoding "";

        location = /healthz { return 200 "ok\n"; }

        # Xet tokens would send the client to the Xet CAS on the internet.
        location ~ "/xet-(read|write)-token/" { return 403 "xet is not served by this cache\n"; }

        location ~ "^/(?:(?:datasets|spaces)/)?(?:[^/]+/)?[^/]+/resolve/[0-9a-f]{40}/" {
            proxy_pass http://unix:/tmp/kailo-hf-hub.sock:;
            proxy_cache hf_files;
            proxy_cache_key "resolve$request_uri";
            proxy_cache_valid 200 3650d;
            proxy_cache_valid 404 1m;
        }
        location ~ "^/(?:(?:datasets|spaces)/)?(?:[^/]+/)?[^/]+/resolve/" {
            proxy_pass http://unix:/tmp/kailo-hf-hub.sock:;
            proxy_cache hf_files;
            proxy_cache_key "resolve$request_uri";
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        }
        location ~ "^/api/(?:models|datasets|spaces)/.+/(?:revision|tree|paths-info)/[0-9a-f]{40}(?:/|$)" {
            proxy_pass http://unix:/tmp/kailo-hf-hub.sock:;
            proxy_cache hf_api;
            proxy_cache_key "api$request_uri";
            proxy_cache_valid 200 3650d;
            proxy_cache_valid 404 1m;
        }
        location /api/ {
            proxy_pass http://unix:/tmp/kailo-hf-hub.sock:;
            proxy_cache hf_api;
            proxy_cache_key "api$request_uri";
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
        }

        location / { return 404 "not served by this cache\n"; }
    }

    # The hub server: upstream requests and redirect following, nothing stored.
    server {
        listen unix:/tmp/kailo-hf-hub.sock;

        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # Signed CDN redirects carry long URLs and headers.
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_intercept_errors on;
        recursive_error_pages on;

        # File downloads: a revalidation's validators (If-None-Match) go through unchanged.
        location / {
            set $hf_origin @HF_ORIGIN@;
            set $hf_seen_commit "";
            set $hf_seen_etag "";
            set $hf_seen_size "";
            set $hf_next "";
            proxy_pass $hf_origin$request_uri;
            proxy_set_header Connection "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Link;
            proxy_hide_header X-Xet-Hash;
            proxy_hide_header X-Xet-Refresh-Route;
            proxy_hide_header X-Xet-Cas-Url;
            proxy_hide_header X-Xet-Access-Token;
            proxy_hide_header X-Xet-Token-Expiration;
            proxy_hide_header Alt-Svc;
            error_page 301 302 303 307 308 = @file_redirect;
        }
        location @file_redirect {
            set $hf_seen_commit $hf_seen_commit_next;
            set $hf_seen_etag $hf_seen_etag_next;
            set $hf_seen_size $hf_seen_size_next;
            set $hf_next $hf_target;
            set $hf_origin $hf_next_origin;
            proxy_pass $hf_next;
            proxy_set_header Connection "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Link;
            proxy_hide_header X-Xet-Hash;
            proxy_hide_header X-Xet-Refresh-Route;
            proxy_hide_header X-Xet-Cas-Url;
            proxy_hide_header X-Xet-Access-Token;
            proxy_hide_header X-Xet-Token-Expiration;
            proxy_hide_header Alt-Svc;
            proxy_hide_header X-Repo-Commit;
            proxy_hide_header X-Linked-Etag;
            proxy_hide_header X-Linked-Size;
            add_header X-Repo-Commit $hf_commit_out always;
            add_header X-Linked-Etag $hf_etag_out always;
            add_header X-Linked-Size $hf_size_out always;
            error_page 301 302 303 307 308 = @file_redirect;
        }

        # The API: uncompressed from the upstream so the tree listing's xetHash can be renamed; pagination rewritten.
        location /api/ {
            set $hf_origin @HF_ORIGIN@;
            set $hf_seen_commit "";
            set $hf_seen_etag "";
            set $hf_seen_size "";
            set $hf_next "";
            proxy_pass $hf_origin$request_uri;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Link;
            proxy_hide_header Alt-Svc;
            add_header Link $hf_link always;
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter '"xetHash"' '"kailoXetHashNotServed"';
            error_page 301 302 303 307 308 = @api_redirect;
        }
        location @api_redirect {
            set $hf_next $hf_target;
            set $hf_origin $hf_next_origin;
            proxy_pass $hf_next;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Link;
            proxy_hide_header Alt-Svc;
            add_header Link $hf_link always;
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter '"xetHash"' '"kailoXetHashNotServed"';
            error_page 301 302 303 307 308 = @api_redirect;
        }
    }
}
