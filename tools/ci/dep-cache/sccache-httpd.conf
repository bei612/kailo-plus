# Kailo CI shared Rust compile cache for the image builds: sccache's WebDAV backend (SCCACHE_WEBDAV_ENDPOINT) on
# Apache mod_dav, rendered by setup.sh (@...@ placeholders). Builds reach it as kailo-macro KAILO_SCCACHE_WEBDAV.
# sccache's client (opendal) uses PROPFIND, MKCOL, PUT and GET; nginx's dav module has no PROPFIND (2026-11-23: 405,
# the sccache server refused to start), mod_dav implements RFC 4918. Entries are content-addressed by sccache
# (compiler, flags, sources), stored as <k0>/<k1>/<k2>/<key>. Size is kept by the hot-retention policy (root
# dep-cache/sccache/data, max_bytes: least recently used key partitions go first).
# DavLockDB: mod_dav_fs checks it on every write (If: header verification), so the DBM driver must load or each PUT is
# a 500; it lives in apr-util's default DBM type (Berkeley DB in the Debian image, see compose.yaml), next to (not
# inside) the served tree. setup.sh probe exercises MKCOL, PUT, PROPFIND, GET and DELETE.
ServerRoot "/usr/local/apache2"
Listen @BIND@:@PORT@
ServerName kailo-sccache
PidFile /tmp/httpd.pid
# Read-only root filesystem: runtime files (mutexes, sockets) go to the tmpfs.
DefaultRuntimeDir /tmp
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule status_module modules/mod_status.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule dav_lock_module modules/mod_dav_lock.so
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%{%Y-%m-%dT%H:%M:%S}t %>s %m %B %U" sccache
CustomLog /proc/self/fd/1 sccache
DavLockDB /var/cache/kailo-sccache/.davlock
LimitRequestBody 2147483648
Timeout 300
KeepAlive On
DocumentRoot "/var/cache/kailo-sccache/data"
<Directory />
    Require all denied
</Directory>
<Directory "/var/cache/kailo-sccache/data">
    Dav On
    Options None
    AllowOverride None
    # Bound to the kailo0 gateway only (OPS-03): the host and the builds on the Kailo dockerd reach it, the LAN does not.
    Require all granted
</Directory>
<Location /healthz>
    SetHandler server-status
    Require all granted
</Location>
