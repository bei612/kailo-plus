# Kailo CI 依赖下载缓存：npm（Verdaccio）、Go 模块（Athens）、crates.io 与构建下载文件（nginx）、PyPI 与 PyTorch CPU 索引（proxpi）、Hugging Face（nginx）。用途、数据位置与回源方式见 07-运行与运维基线.md §2.1。
# 由 tools/ci/dep-cache/setup.sh up 安装到运行副本目录并启动；改配置先改本仓库。
# 出网直连上游（路由器 OpenWrt 透明代理负责），不设置任何代理变量；数据在 4T 容量盘。
name: kailo-dep-cache
x-hardening: &hardening
  restart: unless-stopped
  # 以数据目录属主运行；host 网络。监听地址 DEP_CACHE_BIND（缺省 10.239.0.1，即 Kailo dockerd 的 kailo0 网关）：宿主进程、host 网络的
  # 构建与 bridge 网络里的容器和构建（RUN 步骤）都能访问，不暴露到局域网（OPS-03）。
  user: "${DEP_CACHE_USER:-1000:1000}"
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
services:
  npm:
    <<: *hardening
    image: verdaccio/verdaccio@sha256:82f4decaf1c9eff885bf7a1227335f78581ff715288d5f38898e67e28b3bfbdd  # 6.11.1
    environment:
      VERDACCIO_ADDRESS: ${DEP_CACHE_BIND:-10.239.0.1}
      VERDACCIO_PORT: ${NPM_CACHE_PORT:-55002}
      VERDACCIO_PROTOCOL: http
      # The node has no IPv6 route: try IPv4 first instead of timing out on AAAA records (crashed Verdaccio under load).
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - ./verdaccio.yaml:/verdaccio/conf/config.yaml:ro
      - ${DEP_CACHE_DATA:-/volumes/data/kailo/capacity/dep-cache}/npm:/verdaccio/storage
    tmpfs: [/tmp]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://${DEP_CACHE_BIND:-10.239.0.1}:${NPM_CACHE_PORT:-55002}/-/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  go:
    <<: *hardening
    image: gomods/athens@sha256:3620ce7230c723bdeac51f112541a659bf44923416b02f69cabf981fd9c0324a  # v0.20.0
    environment:
      ATHENS_PORT: ${DEP_CACHE_BIND:-10.239.0.1}:${GO_CACHE_PORT:-55003}
      ATHENS_STORAGE_TYPE: disk
      ATHENS_DISK_STORAGE_ROOT: /var/lib/athens
      # 未命中时 Athens 以 go mod download 经原站取模块；校验和仍由客户端按 go.sum 核对
      ATHENS_GO_BINARY_ENV_VARS: GOPROXY=https://proxy.golang.org,direct
      ATHENS_GOGET_WORKERS: "8"
      ATHENS_LOG_LEVEL: warning
      HOME: /tmp
    volumes:
      - ${DEP_CACHE_DATA:-/volumes/data/kailo/capacity/dep-cache}/go:/var/lib/athens
    tmpfs: ["/tmp:size=4g"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://${DEP_CACHE_BIND:-10.239.0.1}:${GO_CACHE_PORT:-55003}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  # crates.io sparse-index and crate cache (OPS-03): nginx's proxy_cache in front of a crates.io mirror. The index is
  # revalidated every 10 minutes and served stale when the upstream fails; crate files are immutable and kept. Its
  # config.json points Cargo's downloads back at this cache. nginx.conf is rendered by setup.sh (CRATES_* settings).
  crates:
    <<: *hardening
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./crates-nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEP_CACHE_DATA:-/volumes/data/kailo/capacity/dep-cache}/crates:/var/cache/kailo-crates
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://${DEP_CACHE_BIND:-10.239.0.1}:${CRATES_CACHE_PORT:-55007}/index/config.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  # apt archives and pinned release downloads of the image builds (GitHub releases, Maven, rustup, nodejs.org):
  # nginx's proxy_cache, data on the capacity disk. Debian indexes and moving rust channel manifests are revalidated and
  # served stale when the upstream fails; versioned files are kept. nginx.conf is rendered by setup.sh (FILES_* settings).
  files:
    <<: *hardening
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./files-nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEP_CACHE_DATA:-/volumes/data/kailo/capacity/dep-cache}/files:/var/cache/kailo-files
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://${DEP_CACHE_BIND:-10.239.0.1}:${FILES_CACHE_PORT:-55008}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  # PyPI pull-through cache of the image builds (kailo-macro KAILO_PYPI_MIRROR, a simple-index URL: http://<bind>:<port>/index/):
  # proxpi, which serves the upstream's simple index (HTML and PEP 691 JSON) with every file link rewritten to itself and
  # keeps the downloaded files on the capacity disk (least-used evicted above PROXPI_CACHE_SIZE). Hashes are the
  # upstream's, so pip --require-hashes / uv still verify every file. A download in flight is waited for
  # (PROXPI_DOWNLOAD_TIMEOUT): proxpi's default answers a slow download with a redirect to the upstream, which a build
  # without internet access cannot follow. The index is held in memory for PROXPI_INDEX_TTL.
  pypi:
    <<: *hardening
    image: epicwink/proxpi@sha256:c1c21a5dba50385918116bea30a96fd7227193deef85fdde2d015897dcf4eb5c  # 1.3.1
    command: ["--bind", "${DEP_CACHE_BIND:-10.239.0.1}:${PYPI_CACHE_PORT:-55011}", "--threads", "16", "--no-control-socket", "--worker-tmp-dir", "/tmp"]
    environment: &proxpi-env
      PROXPI_INDEX_URL: ${PYPI_UPSTREAM:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/}
      PROXPI_INDEX_TTL: "600"
      PROXPI_CACHE_DIR: /var/cache/proxpi
      PROXPI_CACHE_SIZE: ${PYPI_CACHE_BYTES:-64424509440}
      PROXPI_DOWNLOAD_TIMEOUT: "1800"
      PROXPI_CONNECT_TIMEOUT: "20"
      PROXPI_READ_TIMEOUT: "120"
      PROXPI_BINARY_FILE_MIME_TYPE: "1"
      PROXPI_LOGGING_LEVEL: WARNING
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    volumes:
      - ${DEP_CACHE_DATA:-/volumes/data/kailo/capacity/dep-cache}/pypi:/var/cache/proxpi
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://${DEP_CACHE_BIND:-10.239.0.1}:${PYPI_CACHE_PORT:-55011}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  # PyTorch CPU wheel index (kailo-macro KAILO_TORCH_INDEX: http://<bind>:<port>/index/), the same proxpi over
  # download.pytorch.org/whl/cpu: a separate index, so a build that asks it for torch gets the CPU build and never PyPI's
  # CUDA one. Its links point at download-r2.pytorch.org; proxpi rewrites them like PyPI's.
  torch:
    <<: *hardening
    image: epicwink/proxpi@sha256:c1c21a5dba50385918116bea30a96fd7227193deef85fdde2d015897dcf4eb5c  # 1.3.1
    command: ["--bind", "${DEP_CACHE_BIND:-10.239.0.1}:${TORCH_CACHE_PORT:-55013}", "--threads", "8", "--no-control-socket", "--worker-tmp-dir", "/tmp"]
    environment:
      <<: *proxpi-env
      PROXPI_INDEX_URL: ${TORCH_UPSTREAM:-https://download.pytorch.org/whl/cpu/}
      PROXPI_CACHE_SIZE: ${TORCH_CACHE_BYTES:-32212254720}
    volumes:
      - ${DEP_CACHE_DATA:-/volumes/data/kailo/capacity/dep-cache}/torch:/var/cache/proxpi
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://${DEP_CACHE_BIND:-10.239.0.1}:${TORCH_CACHE_PORT:-55013}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  # Hugging Face Hub cache (kailo-macro KAILO_HF_MIRROR, an HF_ENDPOINT: http://<bind>:<port>): nginx's proxy_cache in
  # front of an internal server that talks to the Hub and follows its redirects (relative /api/resolve-cache, absolute
  # CDN and mirror hops) itself, keeping the Hub headers huggingface_hub needs (X-Repo-Commit, X-Linked-Etag/Size) and
  # dropping the Xet ones, so clients download over plain HTTP from this cache only. Files under a commit id are kept;
  # branch revisions and API answers are revalidated every 10 minutes and served stale when the upstream fails.
  # nginx.conf is rendered by setup.sh (HF_* settings).
  hf:
    <<: *hardening
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./hf-nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEP_CACHE_DATA:-/volumes/data/kailo/capacity/dep-cache}/hf:/var/cache/kailo-hf
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://${DEP_CACHE_BIND:-10.239.0.1}:${HF_CACHE_PORT:-55012}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  # Shared Rust compile cache of the image builds (sccache WebDAV backend, kailo-macro KAILO_SCCACHE_WEBDAV): Apache
  # mod_dav over the capacity disk (sccache's client needs PROPFIND, which nginx's dav module lacks). httpd.conf is
  # rendered by setup.sh (SCCACHE_CACHE_PORT). The Debian (trixie) variant of the official image: mod_dav_fs keeps
  # DavLockDB in apr-util's default DBM, and only the Debian build ships that driver (apr_dbm_db + libdb5.3); the
  # Alpine variant lacks apr-util-dbm_*, so every PUT failed with 500 "DBM driver could not be loaded" (2026-11-23..28).
  # No wget/curl in this image: the healthcheck speaks HTTP over bash's /dev/tcp.
  sccache:
    <<: *hardening
    image: httpd:2.4@sha256:eef26a140e2817b6d9fa9b9eba883eb79b5a40032ca988503c8f7e40f90d0959  # 2.4.71-trixie
    entrypoint: ["httpd", "-DFOREGROUND", "-f", "/usr/local/apache2/conf/kailo-sccache.conf"]
    volumes:
      - ./sccache-httpd.conf:/usr/local/apache2/conf/kailo-sccache.conf:ro
      - ${DEP_CACHE_DATA:-/volumes/data/kailo/capacity/dep-cache}/sccache:/var/cache/kailo-sccache
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/${DEP_CACHE_BIND:-10.239.0.1}/${SCCACHE_CACHE_PORT:-55010} && printf 'GET /healthz?auto HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 4 grep -q '^HTTP/1.1 200 ' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
