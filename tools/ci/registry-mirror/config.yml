# Kailo CI 镜像拉取缓存（distribution 3 proxy 模式），一个实例对应一个上游 registry。
# 只缓存公开内容；不保存凭据，不接受 push。上游与监听地址由 compose.yaml 的环境变量按实例给出
# （REGISTRY_PROXY_REMOTEURL、REGISTRY_HTTP_ADDR）。出网直连（路由器 OpenWrt 透明代理负责），本缓存不使用任何代理。
version: 0.1
log:
  level: info
  fields:
    service: kailo-registry-mirror
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
  maintenance:
    uploadpurging:
      enabled: true
      age: 24h
      interval: 24h
      dryrun: false
http:
  addr: 127.0.0.1:55001
  headers:
    X-Content-Type-Options: [nosniff]
health:
  storagedriver:
    enabled: true
    interval: 30s
    threshold: 3
proxy:
  remoteurl: https://registry-1.docker.io
  # 缓存条目写入 30 天后由 registry 调度器删除，磁盘占用随在用基础镜像集合有界；基础镜像按 digest 固定、变化稀疏。
  ttl: 720h
