# Kailo CI 镜像拉取缓存：Docker Hub、ghcr.io、quay.io、gcr.io 各一个 distribution proxy 实例。
# 用途、数据位置与回退方式见 07-运行与运维基线.md §2.1。由 tools/ci/registry-mirror/setup.sh mirror 安装到运行副本目录
# 并启动；改配置先改本仓库。数据在 4T 容量盘（MIRROR_DATA/<实例>）。
# 出网：直连上游（路由器 OpenWrt 透明代理负责），不设置任何 HTTP/SOCKS 代理变量。
name: kailo-registry-mirror
x-mirror: &mirror
  # 与 deploy/local 私有 registry 同一 registry:3（distribution 3.1.1）digest。
  image: registry@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
  restart: unless-stopped
  # 以数据目录属主运行，无需任何 capability 写入缓存目录。
  user: "${MIRROR_USER:-1000:1000}"
  # host 网络，只监听回环地址：Kailo dockerd（registry-mirrors）与 network=host 的 BuildKit 都经 127.0.0.1 访问。
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 512m
  memswap_limit: 512m
  cpus: 1.0
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
services:
  hub:
    <<: *mirror
    environment:
      REGISTRY_HTTP_ADDR: 127.0.0.1:${MIRROR_PORT_HUB:-55001}
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
    volumes:
      - ./config.yml:/etc/distribution/config.yml:ro
      - ${MIRROR_DATA:-/volumes/data/kailo/capacity/registry-mirror}/docker.io:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${MIRROR_PORT_HUB:-55001}/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  ghcr:
    <<: *mirror
    environment:
      REGISTRY_HTTP_ADDR: 127.0.0.1:${MIRROR_PORT_GHCR:-55004}
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
    volumes:
      - ./config.yml:/etc/distribution/config.yml:ro
      - ${MIRROR_DATA:-/volumes/data/kailo/capacity/registry-mirror}/ghcr.io:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${MIRROR_PORT_GHCR:-55004}/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  quay:
    <<: *mirror
    environment:
      REGISTRY_HTTP_ADDR: 127.0.0.1:${MIRROR_PORT_QUAY:-55005}
      REGISTRY_PROXY_REMOTEURL: https://quay.io
    volumes:
      - ./config.yml:/etc/distribution/config.yml:ro
      - ${MIRROR_DATA:-/volumes/data/kailo/capacity/registry-mirror}/quay.io:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${MIRROR_PORT_QUAY:-55005}/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  gcr:
    <<: *mirror
    environment:
      REGISTRY_HTTP_ADDR: 127.0.0.1:${MIRROR_PORT_GCR:-55006}
      REGISTRY_PROXY_REMOTEURL: https://gcr.io
    volumes:
      - ./config.yml:/etc/distribution/config.yml:ro
      - ${MIRROR_DATA:-/volumes/data/kailo/capacity/registry-mirror}/gcr.io:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${MIRROR_PORT_GCR:-55006}/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
