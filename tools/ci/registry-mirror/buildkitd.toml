# kailo-builder BuildKit 配置，由 setup.sh builder 在重建 builder 时写入容器。
# 各上游先走本机拉取缓存（compose.yaml，数据在 4T 容量盘）；缓存不可达或失败时 BuildKit 依序回退到原站直连。
# 端口须与 compose.yaml 的 MIRROR_PORT_* 缺省一致（setup.sh mirror 会核对）。
# 未设置 GC 项：沿用 BuildKit 按状态盘容量计算的默认策略；部署入口另以 builder prune --max-used-space 约束。

[registry."docker.io"]
  mirrors = ["127.0.0.1:55001"]

[registry."ghcr.io"]
  mirrors = ["127.0.0.1:55004"]

[registry."quay.io"]
  mirrors = ["127.0.0.1:55005"]

[registry."gcr.io"]
  mirrors = ["127.0.0.1:55006"]

[registry."127.0.0.1:55001"]
  http = true

[registry."127.0.0.1:55004"]
  http = true

[registry."127.0.0.1:55005"]
  http = true

[registry."127.0.0.1:55006"]
  http = true
