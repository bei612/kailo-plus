# kailo-builder BuildKit 配置，由 setup.sh builder 在重建 builder 时写入容器。
# 各上游先走本机拉取缓存（compose.yaml，数据在 4T 容量盘）；缓存不可达或失败时 BuildKit 依序回退到原站直连。
# 端口须与 compose.yaml 的 MIRROR_PORT_* 缺省一致（setup.sh mirror 会核对）。
# GC（A-03，2026-11-14，主 Agent 批准）：与 Kailo dockerd 的 builder.gc.policy 相同。BuildKit 默认第一条规则把
# source.local、exec.cachemount、source.git.checkout 合计压到很小（本 builder 约 488MiB，dockerd 默认 8.3GiB），
# 一次构建上下文就能把 apt/bun/cargo 缓存挂载全部挤掉。这里把构建上下文与缓存挂载分开限额，总量上限 120GB。

[registry."docker.io"]
  mirrors = ["127.0.0.1:55001"]

[registry."ghcr.io"]
  mirrors = ["127.0.0.1:55004"]

[registry."quay.io"]
  mirrors = ["127.0.0.1:55005"]

[registry."gcr.io"]
  mirrors = ["127.0.0.1:55006"]

[registry."127.0.0.1:55001"]
  http = true

[registry."127.0.0.1:55004"]
  http = true

[registry."127.0.0.1:55005"]
  http = true

[registry."127.0.0.1:55006"]
  http = true

[worker.oci]
  gc = true

  [[worker.oci.gcpolicy]]
    filters = ["type==source.local"]
    maxUsedSpace = "20GB"

  [[worker.oci.gcpolicy]]
    filters = ["type==source.git.checkout"]
    maxUsedSpace = "5GB"

  [[worker.oci.gcpolicy]]
    filters = ["type==exec.cachemount"]
    maxUsedSpace = "80GB"

  [[worker.oci.gcpolicy]]
    reservedSpace = "60GB"
    maxUsedSpace = "120GB"

  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "60GB"
    maxUsedSpace = "120GB"
