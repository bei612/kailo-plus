# kailo-builder BuildKit 配置，由 setup.sh builder 在重建 builder 时写入容器。
# 各上游先走本机拉取缓存（compose.yaml，数据在 4T 容量盘）；缓存不可达或失败时 BuildKit 依序回退到原站直连。
# 端口须与 compose.yaml 的 MIRROR_PORT_* 缺省一致（setup.sh mirror 会核对）。
# GC（A-03，2026-11-14）：BuildKit 默认第一条规则把 source.local、exec.cachemount、source.git.checkout 合计压到很小
# （本 builder 约 488MiB），一次构建上下文就能把 apt/bun/cargo 缓存挂载全部挤掉，故分开限额，总量上限 160GB。
# OPS-04（2026-11-15）：CI 检查镜像与部署 up.sh（KAILO_BUILDER）的构建都走本 builder，状态卷在 4T 盘
# （/volumes/data/kailo/capacity/ci/buildkit）；dockerd 自带的 default builder 只留 10GB（kailo-docker/install.sh）。
# retention/policy.json 的 kailo-builder 上限与部署 KAILO_BUILD_CACHE_LIMIT 须与这里的总上限一致。

[registry."docker.io"]
  mirrors = ["127.0.0.1:55001"]

[registry."ghcr.io"]
  mirrors = ["127.0.0.1:55004"]

[registry."quay.io"]
  mirrors = ["127.0.0.1:55005"]

[registry."gcr.io"]
  mirrors = ["127.0.0.1:55006"]

[registry."127.0.0.1:55001"]
  http = true

[registry."127.0.0.1:55004"]
  http = true

[registry."127.0.0.1:55005"]
  http = true

[registry."127.0.0.1:55006"]
  http = true

[worker.oci]
  gc = true

  # The state lives on NVMe (/var/lib/kailo-ci/buildkit, 2026-11-22): builds are small random I/O (layer extraction,
  # dpkg, layer export), which the 4T disk served at ~300 ms per synchronous write (a chromium apt step 860 s, one
  # image export 15 min). The caps keep it within the NVMe budget (CI-CD 手册「NVMe 预算」, total 60GB, matching
  # KAILO_BUILD_CACHE_LIMIT; 100GB at first, lowered on 2026-11-23 when the first NVMe deploy peaked at 84% beside the CI
  # target slots and the daemon's images); what lasts stays on the 4T disk: base images in the registry mirrors (an evicted base
  # is pulled back from the local mirror, never from the internet), release images in the release registry, and
  # the dependency caches (npm, Go, crates, files, git).
  # 2026-11-24: cache mounts 25GB -> 55GB, total 60GB -> 90GB. The Rust targets (backend, web wasm, codex, sync) are
  # cache mounts and together exceed 25GB, so GC dropped them after every build and each deploy recompiled all 1658
  # crates from scratch (step 0: 3608-4374 s). They now stay, so a deploy recompiles only the crates that changed.
  # 2026-11-26 (b9/prebuilt-deploy): BuildKit compares every rule's maxUsedSpace with the size of ALL cache records, the
  # rule's filter only selects what it may delete (moby/buildkit cache/manager.go prune: DiskUsage without a filter,
  # then pruneOnce with the rule's filter). The former per-type figures (source.local 5GB, git 2GB, cache mounts 55GB,
  # regular 35GB) were therefore not quotas: with the cache mounts alone at 45GB, the "regular 35GB" rule deleted every
  # image layer after every build (kailo-builder held 11 cache mounts and 0 layers after deploy d2c2b375e6), so each
  # deploy re-pulled base images and re-ran apt, bun install (75-2925 s per image) and the wasm tool installs, and the
  # cache-mount rule evicted the wasm package cache. The rules are now an eviction order over the total: build contexts
  # first, then git checkouts, then image layers (least recently used first), and only above the full cap anything,
  # cache mounts included.
  [[worker.oci.gcpolicy]]
    filters = ["type==source.local"]
    maxUsedSpace = "40GB"

  [[worker.oci.gcpolicy]]
    filters = ["type==source.git.checkout"]
    maxUsedSpace = "40GB"

  [[worker.oci.gcpolicy]]
    filters = ["type==regular"]
    maxUsedSpace = "70GB"

  [[worker.oci.gcpolicy]]
    reservedSpace = "20GB"
    maxUsedSpace = "90GB"

  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "20GB"
    maxUsedSpace = "90GB"
