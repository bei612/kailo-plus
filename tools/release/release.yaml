# 发布入口（tools/release/kailo-release.sh，ADR-20）的声明。
#
# 这里只登记现有登记数据推不出的事实。产物清单、产物→服务映射、需要改写的 pin、部署对象、
# 一次性前置、备份对象都由入口从下列登记推导，不在此另列：
#   */fork/upstream.yaml                 二开产物、输入范围、source_digest / artifact_digest
#   deploy/local/compose.yaml            image: ${REGISTRY_HOST}/<产物>@sha256:… → 服务；depends_on
#   tools/traceability/*.yaml            release.artifacts[].digest
#   CI 持久证明库 <镜像>.<digest>.provenance.json   自建单元产物 → 源码 commit
#   CI 节点 ci/config.json               运行目录、发布树根、证明库、Compose 项目名、Web build-info 位置

# 自建发布单元：不在 */fork/upstream.yaml 中，由各自构建入口产出按 digest 命名的 provenance。
units:
  core-worker:
    builder: tools/release.sh        # CI 构建目标同名：kailo-ci submit <commit> build core-worker
    images: [core, worker]
    # tools/release.sh 从固定 commit 导出的构建输入，与 .dockerignore 的 allowlist 同步。
    # release.sh 与规划阶段都只读这一份：规划据此判断已固定产物的源 commit 之后输入是否变化。
    inputs:
      - .dockerignore
      - core
      - worker
      - collaboration/Cargo.toml
      - collaboration/crates/buzz-core
      - collaboration/crates/buzz-sdk
      - collaboration/crates/buzz-project-git
      - contracts
      - model-gateway/crates/protos/proto/ext_mcp.proto
      - tools/registry/capabilities.yaml
      - agent-runtime/fork/upstream.yaml

# 默认部署方式（compose up -d --no-deps --force-recreate --no-build --wait <服务>）不适用的服务。
# drift：配置漂移的收敛方式（ADR-20 §9），缺省 converge（漂移即按依赖顺序重建）；report 只报告。
services:
  openbao:
    # 重建即封存：本拓扑没有 auto-unseal，解封要用 secrets/openbao_init.json 中的分片经
    # secret-store-init.sh 执行，`up --wait` 也会因健康检查（封存返回 503）超时。封存期间所有
    # SecretRef 不可读、Core 与组件凭据投递中断，这不是服务替换能完成的动作，由运维窗口处理。
    drift: report
  core-bff:
    # 每次启动都要新的一次性 OpenBao 投递（DD-70），不能以 compose up 重用已消费的投递。
    command: [./start-core.sh, --no-build]
    migrations: core
  buzz-web:
    # 回读容器内 build-info：buildId 必须等于 web-client 记录的 source_digest。
    # 文件位置取 CI 配置的同名键（与 worker 的 Web 部署回读同一来源）。
    build_info: web_build_info_path

# 迁移：目录相对仓库根；数据库连接串经运行目录中的受控 env 文件投递，只经 stdin 进入迁移容器。
migrations:
  core:
    database: core-db
    source: core/migrations
    url_env_file: secrets/core-db-url.env

# 03 §7 的兼容顺序：迁移 → Core/Worker → 其余产物 → Web。同组内按 compose 的服务定义顺序。
order:
  first: [core, worker]
  last: [web-client]

# IdP 声明式配置（ADR-20 §1、DD-133(3)(6)、SS-AGW-END-SESSION）。deploy 在 keycloak 就绪后、替换任何服务前执行：
# 配置摘要（inputs 中 INPUT_FILES 的内容 + INPUT_ENV 键及其 ${NAME} 引用在运行 .env 中的原始值摘要）与上次
# 成功应用的不同则依次执行 apply，全部成功后才记录摘要；always 每次 deploy 执行（只给新用户补 picture，客户端只读
# 核对）；verify 阶段执行只读回读。命令在发布树 deploy/local 下以 KAILO_RUNTIME_DIR=运行目录 执行，输出只有状态与计数。
idp:
  wait: keycloak
  inputs: deploy/local/idp-declarations.py
  apply:
    - [./bootstrap.sh, --sync-client-redirects]
    - [./bootstrap.sh, --declare-service-scopes]
    - [./bootstrap.sh, --declare-native-client-profiles]
    - [./bootstrap.sh, --declare-directory-clients]
  always:
    - [./bootstrap.sh, --declare-native-user-pictures]
  verify:
    - [./bootstrap.sh, --verify-client-redirects]
    - [./bootstrap.sh, --verify-service-scopes]
    - [./bootstrap.sh, --verify-native-client-profiles]
    - [./bootstrap.sh, --verify-directory-clients]

# 运行目录中由 start-core.sh 持久派生的 Compose 叠加文件；存在即参与每一次 Compose 调用，
# 否则重建 agentgateway 会丢掉其派生配置。
overlays:
  - secrets/agentgateway-service.compose.json

# 由发布保证的生产 .env 非密键（ADR-20 §4）。键必须登记在 deploy/local/.env.example；值单行、
# 无空白与引号，只允许 ${NAME} 引用。入口只报告键与动作，不输出值。
env:
  set:
    # DD-133(3)(6)：组件专属 client 与其 07 §4.7.5 back-channel 接收端（云盘、知识库、问数）
    NATIVE_OIDC_CLIENTS: kailo-cells-native-browser=http://192.168.0.193:58092/auth/kailo/backchannel-logout,kailo-knowledge-native=http://192.168.0.193:58094/api/v1/auth/oidc/backchannel-logout,platform-local-wren-native-browser=http://192.168.0.193:58095/oauth/backchannel-logout
    # DD-133(4)、07 §4.7.4：三个组件部署单元的成员目录 client（由上方 idp 段声明、凭据写入运行目录
    # secrets/component-directory/<组件>/client_secret）；binding 以 component-bind.mjs --directory-client-id 登记同一值
    COMPONENT_DIRECTORY_CLIENTS: file-storage=kailo-cells-directory,knowledge=kailo-knowledge-directory,data-query=kailo-wren-directory
    # ADR-20 §10：运维域投递的唯一位置，由下方 delivery.protocol_peers 渲染；start-core.sh 以所在目录只读挂载给 Core
    APPLICATION_ADAPTER_DIRECTORY_FILE: ${KAILO_RUNTIME_DIR}/data/protocol-peers/adapter-directory.json
    # DD-136(2)：一致性投递候选集合（每个 artifactDigest 一个子目录，PROTOCOL_PEER 由本入口写入，REMOTE_ADAPTER 由
    # component-deploy.sh --conformance 写入），目录只读挂载给 Core 与 Worker；receiver 凭据目录只挂载给 Worker
    COMPONENT_CONFORMANCE_DIR: ${KAILO_RUNTIME_DIR}/data/conformance
    COMPONENT_CONFORMANCE_WORKER_DIR: ${KAILO_RUNTIME_DIR}/data/conformance-worker
    PROTOCOL_PEER_REFERENCE_CPUS: "0.5"
    # DD-137：Core 管理 MCP 调用的专用受众（亦即 IdP 可选 scope 名，由上方 idp 段声明收敛）
    CORE_MCP_AUDIENCE: kailo-core-mcp
    PROTOCOL_PEER_REFERENCE_MEMORY: 256m
    # OpenMeter Kafka 容器预算（deploy/local/compose.yaml openmeter-kafka 注释为实测依据）：broker heap 1 GiB
    # （运行 .env 的 OPENMETER_KAFKA_HEAP_OPTS='-Xms1G -Xmx1G'，含空白不能在此声明，bootstrap 校验 -Xmx 小于本值）
    # + 堆外约 0.6 GiB + 一个有界健康检查 JVM，合计不到 4 GiB 的一半。
    OPENMETER_KAFKA_MEMORY: 4g
  # DD-136(2)：候选集合取代单一候选的三个文件键（不再手工改 .env 切换候选）
  unset: [COMPONENT_CONFORMANCE_ENVIRONMENT_FILE, COMPONENT_CONFORMANCE_FIXTURE_FILE, COMPONENT_CONFORMANCE_IDENTITY_FILE]

# 运维域运行体（ADR-20 §10、DD-94(2)(5)、DD-136）：上游固定 digest 的外部镜像，不是构建单元。deploy 在漂移收敛
# 与服务替换之前创建缺失者并回读运行、本地解析与健康；已运行者的镜像或配置与发布树不同即是 §9 的配置漂移，
# 由漂移收敛重建。
operated: [protocol-peer-reference]

# 运维域投递（ADR-20 §10、DD-94、DD-98、DD-134(5)、DD-136）：仓库内声明 → 运行目录中的真实规范文件（0644）。
# 交付目录 runtime/adapter-directory.json 的 adapters 保留运行文件中的已有条目（组件入口维护），protocolPeers 整体取
# directory；一致性环境（期望应答由 deploy/local/protocol-peers/record-conformance.py 经同一 Gateway 构建记录）写成
# candidates/<artifactDigest>/environment.json，不再声明的 PROTOCOL_PEER 候选删除，REMOTE_ADAPTER 候选不动（DD-136(2)）。
# Core/Worker 以目录只读挂载并按次读取，内容变化不重建；只有挂载形态（.env 键与这三个位置）与上次经 restart 的启动入口
# 生效的不同时，deploy 才重建该服务。binding 归属事实（DD-98）在网关管理区生成草稿后登记进 directory 的 bindings。
delivery:
  protocol_peers:
    directory: deploy/local/protocol-peers/directory.json
    conformance: deploy/local/protocol-peers/conformance/protocol-peer-reference.json
    runtime: data/protocol-peers
    candidates: data/conformance
    worker: data/conformance-worker
    restart: core-bff

# CI 节点：SSH 名与 CI 执行配置位置。运行目录、发布树根、证明库、Compose 项目名与 Web
# build-info 位置从该配置读取，不在仓库复制。
node:
  ssh: kailo-ci-ssh
  ci_config: /volumes/kailo/ci/config.json
  # ci/config.json environment 中供 start-core.sh 与迁移容器使用的受限资源参数
  ci_environment: [CHECK_CPUS, CHECK_MEMORY, BUILDX_BUILDER]
  backups: /volumes/data/kailo/backups/release
  journal: /volumes/data/kailo/releases
