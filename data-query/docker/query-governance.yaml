# Optional overlay for the existing source-built native UI. It does not create
# a binding, grant a role, publish tools, or manufacture validation evidence.
#
# 07 §2.5 / DD-94 / 03 §9: the native UI is this binding's adapter runtime and
# receives two separate OpenBao Agent deliveries, each from its own namespace
# under its own least-privilege AppRole; no other distribution channel:
#   * platform namespace - the public-only ActionToken JWKS rendered by the
#     platform's Agent (start-core.sh --prepare-action-token, reader role
#     ACTION_TOKEN_JWKS_READER_ROLE) and the Gateway service public JWKS
#     rendered by the Gateway's own Agent delivery (GATEWAY_SERVICE_JWKS_FILE).
#     Both files are mounted read-only at their own paths; no copy is made.
#   * tenants/<tenantId> - the binding's `connection` and `oidc_client_secret`
#     SecretRefs and the api_proxy Unix socket, rendered into
#     WREN_QUERY_DELIVERY_DIR by the component-specific Agent
#     (deploy/components/compose.adapter-agent.yaml, HCL and AppRole written by
#     deploy/components/adapter-delivery.py reader). That Agent is a separate
#     Compose project started by deploy/components/component-deploy.sh
#     data-query <commit> --adapter before this overlay.
# query.json / binding.json in the same directory are written by
# adapter-delivery.py config --kind data-query. The directory must not be a
# user's upload directory or contain platform admin tokens.
services:
  wren-ui:
    environment:
      WREN_PLATFORM_QUERY_CONFIG_FILE: ${WREN_QUERY_DELIVERY_DIR:?Tenant-namespace Agent delivery directory is required}/query.json
      WREN_PLATFORM_BINDING_CONFIG_FILE: ${WREN_QUERY_DELIVERY_DIR:?Tenant-namespace Agent delivery directory is required}/binding.json
    volumes:
      # Same absolute paths as written by adapter-delivery.py and the Agents,
      # so query.json/binding.json file and socket references hold unchanged.
      - type: bind
        source: ${WREN_QUERY_DELIVERY_DIR:?Tenant-namespace Agent delivery directory is required}
        target: ${WREN_QUERY_DELIVERY_DIR:?Tenant-namespace Agent delivery directory is required}
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WREN_QUERY_ACTION_JWKS_FILE:?platform Agent-rendered ActionToken public JWKS is required}
        target: ${WREN_QUERY_ACTION_JWKS_FILE:?platform Agent-rendered ActionToken public JWKS is required}
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GATEWAY_SERVICE_JWKS_FILE:?platform Agent-rendered Gateway service public JWKS is required}
        target: ${GATEWAY_SERVICE_JWKS_FILE:?platform Agent-rendered Gateway service public JWKS is required}
        read_only: true
        bind: {create_host_path: false}
    networks:
      - wren
      - query-platform

networks:
  query-platform:
    external: true
    name: ${WREN_QUERY_PLATFORM_NETWORK:?existing private platform protocol network is required}
