# 07 §8A, DD-136(5): overlay of the isolated Wren conformance instance only
# (tools/component-release/conformance-run.sh data-query, driven by
# tools/component-release/conformance/auto_data_query.py). Never used by a
# production deployment (deploy/components/component-deploy.sh data-query).
#
# * The native Gateway is the published browser entry with platform SSO; the
#   isolated instance has no browser and no platform IdP, so it is not started
#   (profile never activated).
# * native-db: the instance's own PostgreSQL. It holds the original wren-ui
#   metadata database (WREN_DB_TYPE=pg, PG_URL in WREN_UI_SECRET_ENV_FILE; the
#   provider reads project/model/deploy_log through the same URL) and the
#   synthetic source database the data_query@2 vectors describe and query,
#   reached by Ibis only through a read-only role. Its superuser password is
#   a component-only 0600 env file generated by the runner; nothing is published.
services:
  wren-native-gateway:
    profiles: [native-gateway]
  native-db:
    image: ${WREN_CONFORMANCE_DB_IMAGE:?isolated PostgreSQL image digest required}
    restart: on-failure
    env_file:
      - ${WREN_CONFORMANCE_DB_ENV_FILE:?isolated database superuser env file required}
    environment:
      POSTGRES_USER: wren_conformance
      POSTGRES_DB: wren_ui
    volumes:
      - native-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wren_conformance -d wren_ui"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      - wren
  wren-ui:
    depends_on:
      native-db:
        condition: service_healthy

volumes:
  native-db-data:
