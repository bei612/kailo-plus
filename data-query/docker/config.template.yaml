# Kailo deployment template of the native AI Service config.yaml (DD-127(7), DD-128).
# deploy/components/native-config.py renders it into WREN_PROJECT_DIR/config.yaml on every
# `component-deploy.sh data-query`; that file is generated, never edited by hand.
# ${NAME} placeholders are deployment facts: WREN_MODEL_* from the component env
# (native.env), AGENTGATEWAY_MODEL_BASE_URL from the platform .env. A missing fact
# refuses the deployment; nothing falls back to a default. Everything else here is the
# same for every deployment. config.example.yaml stays the upstream example.
type: llm
provider: litellm_llm
# A full SQL generation emits up to max_tokens; at the platform route's measured ~25 tok/s that
# exceeds 120 s, and a client-side timeout aborts an answer the model is still producing.
timeout: 600
models:
  # The one platform chat route (the AgentGateway serves it as its native id).
  - alias: default
    model: openai/${WREN_MODEL_CHAT_ID}
    context_window_size: ${WREN_MODEL_CHAT_CONTEXT_WINDOW}
    api_base: ${AGENTGATEWAY_MODEL_BASE_URL}
    api_key_name: ${WREN_MODEL_API_KEY_NAME}
    kwargs:
      max_tokens: 8192
      n: 1
      seed: 0
      temperature: 0
---
type: embedder
provider: litellm_embedder
models:
  - model: openai/${WREN_MODEL_EMBEDDING_ID}
    alias: default
    api_base: ${AGENTGATEWAY_MODEL_BASE_URL}
    api_key_name: ${WREN_MODEL_API_KEY_NAME}
    timeout: 120

---
type: engine
provider: wren_ui
endpoint: http://wren-ui:3000

---
type: engine
provider: wren_ibis
endpoint: http://ibis-server:8000

---
type: document_store
provider: qdrant
location: http://qdrant:6333
# Measured from an actual embedding response of the configured route.
embedding_model_dim: ${WREN_MODEL_EMBEDDING_DIM}
timeout: 120
# The index is the deployed model's retrieval state: a restart must keep it; Deploy rebuilds it.
recreate_index: false

---
type: pipeline
pipes:
  - name: db_schema_indexing
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: historical_question_indexing
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: table_description_indexing
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: db_schema_retrieval
    llm: litellm_llm.default
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: historical_question_retrieval
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: sql_generation
    llm: litellm_llm.default
    engine: wren_ui
    document_store: qdrant
  - name: sql_correction
    llm: litellm_llm.default
    engine: wren_ui
    document_store: qdrant
  - name: followup_sql_generation
    llm: litellm_llm.default
    engine: wren_ui
    document_store: qdrant
  - name: sql_answer
    llm: litellm_llm.default
  - name: semantics_description
    llm: litellm_llm.default
  - name: relationship_recommendation
    llm: litellm_llm.default
  - name: question_recommendation
    llm: litellm_llm.default
  - name: question_recommendation_sql_generation
    llm: litellm_llm.default
    engine: wren_ui
    document_store: qdrant
  - name: intent_classification
    llm: litellm_llm.default
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: misleading_assistance
    llm: litellm_llm.default
  - name: data_assistance
    llm: litellm_llm.default
  - name: sql_pairs_indexing
    document_store: qdrant
    embedder: litellm_embedder.default
  - name: sql_pairs_retrieval
    document_store: qdrant
    embedder: litellm_embedder.default
    llm: litellm_llm.default
  - name: preprocess_sql_data
    llm: litellm_llm.default
  - name: sql_executor
    engine: wren_ui
  - name: chart_generation
    llm: litellm_llm.default
  - name: chart_adjustment
    llm: litellm_llm.default
  - name: user_guide_assistance
    llm: litellm_llm.default
  - name: sql_question_generation
    llm: litellm_llm.default
  - name: sql_generation_reasoning
    llm: litellm_llm.default
  - name: followup_sql_generation_reasoning
    llm: litellm_llm.default
  - name: sql_regeneration
    llm: litellm_llm.default
    engine: wren_ui
  - name: instructions_indexing
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: instructions_retrieval
    embedder: litellm_embedder.default
    document_store: qdrant
  - name: sql_functions_retrieval
    engine: wren_ibis
    document_store: qdrant
  - name: project_meta_indexing
    document_store: qdrant
  - name: sql_tables_extraction
    llm: litellm_llm.default
  - name: sql_diagnosis
    llm: litellm_llm.default

---
settings:
  doc_endpoint: https://docs.getwren.ai
  is_oss: true
  # Kailo DD-163: product help is Kailo's; no user-guide answers, no upstream docs fetch.
  allow_user_guide: false
  engine_timeout: 30
  column_indexing_batch_size: 50
  table_retrieval_size: 10
  table_column_retrieval_size: 100
  allow_intent_classification: true
  allow_sql_generation_reasoning: true
  allow_sql_functions_retrieval: true
  enable_column_pruning: false
  max_sql_correction_retries: 3
  query_cache_maxsize: 1000
  query_cache_ttl: 3600
  langfuse_host: https://cloud.langfuse.com
  # No telemetry leaves the deployment for the Langfuse cloud (no Langfuse keys are delivered).
  langfuse_enable: false
  logging_level: DEBUG
  development: false
  historical_question_retrieval_similarity_threshold: 0.9
  sql_pairs_similarity_threshold: 0.7
  sql_pairs_retrieval_max_size: 10
  instructions_similarity_threshold: 0.7
  instructions_top_k: 10