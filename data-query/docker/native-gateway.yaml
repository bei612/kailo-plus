# SS-WRN-IDENTITY: this is the native service's dedicated browser gateway,
# not the platform's dynamic Tool/ModelRoute gateway configuration.
# OIDC creates its own encrypted HttpOnly browser cookie. Only its verified
# component-specific ID token is forwarded on the private backend hop.
#
# DD-133 §2 (embedded single sign-on). The OIDC policy is attached to the
# native UI route instead of the listener so that one static, credential-free
# page can be served before authentication:
#   /kailo-embed/signin      login.redirect target. At top level it continues
#                            to /auth/login. Inside the Kailo iframe it first
#                            tries the existing IdP session in a hidden
#                            same-origin frame (the IdP login page refuses to be
#                            framed, so a missing session is detected without
#                            showing it); when that fails it tells the Kailo
#                            host (postMessage, exact Kailo origin only) so
#                            Kailo signs in at top level; until then it offers
#                            the IdP sign-in in a separate window.
#   /kailo-embed/auth-ok     landing page of that hidden attempt.
#   /kailo-embed/popup-done  end of the fallback sign-in window that the Kailo
#                            frame sandbox allows (popups, not top navigation).
#   /kailo-embed/return      for a host-initiated top-level sign-in
#                            (/auth/login?returnTo=/kailo-embed/return?to=URL):
#                            back to an exact KAILO_FRAME_ANCESTORS origin only.
#   /kailo-embed/signed-out  logout.redirect target: tells the Kailo host, or at
#                            top level continues to KAILO_LOGOUT_URL when set.
# The page receives no identity, cookie or upstream response. Its only script is
# pinned by the CSP hash below; the configuration loader expands $-variables,
# so the script deliberately contains no dollar sign.
#
# Generated by kailo-embed/render.py from kailo-embed/bootstrap.js; edit those.
config:
  adminAddr: 127.0.0.1:${WREN_GATEWAY_ADMIN_PORT}
binds:
  - port: ${WREN_GATEWAY_HTTP_PORT}
    listeners:
      - name: wren-native-browser
        protocol: HTTP
        policies:
          transformations:
            request:
              remove:
                - authorization
                - cookie
                - proxy-authorization
                - x-platform-oidc-issuer
                - x-platform-oidc-subject
                - x-platform-tenant
                - x-platform-workspace
                - x-platform-principal
        routes:
          - name: kailo-embed-page
            matches:
              - path:
                  pathPrefix: /kailo-embed/
            policies:
              directResponse:
                status: 200
                headers:
                  content-type: '"text/html; charset=utf-8"'
                  cache-control: '"no-store"'
                  x-content-type-options: '"nosniff"'
                  referrer-policy: '"strict-origin-when-cross-origin"'
                  content-security-policy: '"default-src ''none''; script-src ''sha256-IFbwOvxtf5ZuD+0re7SotALibsG6Rz1wimBqhkCgnOM=''; style-src ''unsafe-inline''; frame-src ''self'' ${WREN_OIDC_ISSUER}/; base-uri ''none''; form-action ''none''; frame-ancestors ''self'' ${KAILO_FRAME_ANCESTORS}"'
                body: |
                  <!doctype html>
                  <html lang="zh-CN">
                  <head>
                  <meta charset="utf-8">
                  <meta name="viewport" content="width=device-width,initial-scale=1">
                  <meta name="kailo-origins" content="${KAILO_FRAME_ANCESTORS}">
                  <meta name="kailo-logout-url" content="${KAILO_LOGOUT_URL}">
                  <title></title>
                  <style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:14px/1.6 var(--kailo-font-sans,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif);color:#4b5563;background:transparent}#m{display:none;text-align:center;padding:24px}#l{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:6px;background:#111827;color:#fff;text-decoration:none}@media (prefers-color-scheme:dark){body{color:#d1d5db}#l{background:#f3f4f6;color:#111827}}</style>
                  </head>
                  <body>
                  <div id="m"><div id="t"></div><a id="l" target="_top" href="/"></a></div>
                  <script>
                  (function () {
                    var page = location.pathname;
                    var query = new URLSearchParams(location.search);
                    var meta = function (name) {
                      var node = document.querySelector('meta[name="' + name + '"]');
                      return node ? node.getAttribute('content') || '' : '';
                    };
                    var allowed = meta('kailo-origins').split(/\s+/).filter(Boolean);
                    var embedded = window.top !== window.self;
                    var inner = function (name) {
                      try {
                        return new URL(query.get('returnTo') || '/', location.origin).searchParams.get(name);
                      } catch (error) {
                        return null;
                      }
                    };
                    var english = /^en/i.test(query.get('kailo_locale') || inner('kailo_locale') || navigator.language || '');
                    var text = english
                      ? { expired: 'Your session has ended. Sign in again to continue.', signin: 'Sign in', out: 'You have signed out.', back: 'Back' }
                      : { expired: '登录状态已失效，请重新登录后继续。', signin: '重新登录', out: '已退出登录。', back: '返回' };
                    document.documentElement.lang = english ? 'en' : 'zh-CN';
                    var local = function (value) {
                      return typeof value === 'string' && value.charAt(0) === '/' && value.charAt(1) !== '/' && !/[\\\u0000- \u007f]/.test(value) ? value : '/';
                    };
                    var kailo = function (value) {
                      try {
                        var url = new URL(value);
                        return allowed.indexOf(url.origin) >= 0 ? url.href : null;
                      } catch (error) {
                        return null;
                      }
                    };
                    var host = function () {
                      var candidates = [];
                      if (location.ancestorOrigins && location.ancestorOrigins.length) candidates.push(location.ancestorOrigins[0]);
                      try {
                        if (document.referrer) candidates.push(new URL(document.referrer).origin);
                      } catch (error) {}
                      if (allowed.length === 1) candidates.push(allowed[0]);
                      for (var i = 0; i < candidates.length; i++) if (allowed.indexOf(candidates[i]) >= 0) return candidates[i];
                      return null;
                    };
                    var tell = function (type, detail) {
                      var origin = host();
                      if (!embedded || !origin) return;
                      window.parent.postMessage({ source: 'kailo-native-page', component: 'data-query', type: type, detail: detail || {} }, origin);
                    };
                    var show = function (message, label, href, onClick) {
                      var box = document.getElementById('m');
                      document.getElementById('t').textContent = message;
                      var link = document.getElementById('l');
                      link.textContent = label;
                      link.setAttribute('href', href);
                      if (onClick) {
                        link.setAttribute('target', '_blank');
                        link.addEventListener('click', onClick);
                      }
                      box.style.display = 'block';
                    };
                    var probe = function (done) {
                      var settled = false;
                      var frame = document.createElement('iframe');
                      var finish = function (ok) {
                        if (settled) return;
                        settled = true;
                        frame.remove();
                        done(ok);
                      };
                      frame.style.display = 'none';
                      frame.addEventListener('load', function () {
                        var path = null;
                        try {
                          path = frame.contentWindow.location.pathname;
                        } catch (error) {}
                        finish(path === '/kailo-embed/auth-ok');
                      });
                      setTimeout(function () {
                        finish(false);
                      }, 15000);
                      frame.src = '/auth/login?returnTo=' + encodeURIComponent('/kailo-embed/auth-ok');
                      document.body.appendChild(frame);
                    };
                    if (page === '/kailo-embed/signin') {
                      var target = local(query.get('returnTo'));
                      if (!embedded) {
                        location.replace('/auth/login?returnTo=' + encodeURIComponent(target));
                        return;
                      }
                      var popupLogin = '/auth/login?returnTo=' + encodeURIComponent('/kailo-embed/popup-done');
                      window.addEventListener('message', function (event) {
                        if (event.origin === location.origin && event.data && event.data.source === 'kailo-native-page' && event.data.type === 'signed-in') location.replace(target);
                      });
                      probe(function (ok) {
                        if (ok) {
                          location.replace(target);
                          return;
                        }
                        tell('auth-required', { returnTo: target });
                        show(text.expired, text.signin, popupLogin, function (event) {
                          var popup = window.open(popupLogin, 'kailo-native-signin', 'popup,width=520,height=680');
                          if (popup) event.preventDefault();
                        });
                      });
                    } else if (page === '/kailo-embed/popup-done') {
                      if (window.opener) {
                        try {
                          window.opener.postMessage({ source: 'kailo-native-page', type: 'signed-in' }, location.origin);
                        } catch (error) {}
                        window.close();
                      } else {
                        location.replace('/');
                      }
                    } else if (page === '/kailo-embed/return') {
                      location.replace(kailo(query.get('to') || '') || '/');
                    } else if (page === '/kailo-embed/signed-out') {
                      tell('signed-out');
                      var logout = meta('kailo-logout-url');
                      if (!embedded && logout) {
                        location.replace(logout);
                        return;
                      }
                      var origin = host() || allowed[0];
                      show(text.out, text.back, origin ? origin + '/' : '/');
                    }
                  })();
                  </script>
                  </body>
                  </html>
          - name: native-ui
            matches:
              - path:
                  pathPrefix: /
            policies:
              oidc:
                issuer: ${WREN_OIDC_ISSUER}
                clientId: ${WREN_OIDC_CLIENT_ID}
                clientSecret: ${WREN_OIDC_CLIENT_SECRET}
                redirectURI: ${WREN_OIDC_REDIRECT_URI}
                # DD-133 §3: display name, avatar, e-mail and locale come from
                # the same IdP claims on every login.
                scopes: [profile, email]
                login:
                  path: /auth/login
                  redirect: /kailo-embed/signin
                logout:
                  path: /auth/logout
                  redirect: /kailo-embed/signed-out
              # The pinned Gateway exposes CSRF on routes, not listener policy.
              # This catch-all covers every native UI write with no extra origin.
              csrf: {}
              backendAuth:
                passthrough: {}
            backends:
              - host: ${WREN_UI_UPSTREAM}
