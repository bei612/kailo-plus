# SS-WRN-IDENTITY: this is the native service's dedicated browser gateway,
# not the platform's dynamic Tool/ModelRoute gateway configuration.
# OIDC creates its own encrypted HttpOnly browser cookie. Only its verified
# component-specific ID token is forwarded on the private backend hop.
#
# DD-133(2)/(6) (`.design/07` §4.7.2, §4.7.5). The OIDC policy is attached
# to the native UI route instead of the listener so that one static,
# credential-free page can be served before authentication:
#   /kailo-embed/signin      login.redirect target. At top level it continues
#                            to /auth/login. Inside the Kailo iframe it first
#                            tries the existing IdP session in a hidden
#                            same-origin frame (the IdP login page refuses to be
#                            framed, so a missing session is detected without
#                            ever showing it); when that fails it sends wire v1
#                            {source:"kailo-embed",version:1,type:"auth-required"}
#                            to the exact kailo-web-origin and Kailo signs in at
#                            top level on the user's click.
#   /kailo-embed/auth-ok     landing page of that hidden attempt.
#   /kailo-embed/signed-out  logout.redirect target; at top level it continues
#                            to KAILO_LOGOUT_URL (the Kailo sign-out) when set.
# /oauth/backchannel-logout receives the IdP's signed logout_token (form POST,
# server to server) and ends that sid's (or that subject's) Gateway sessions.
# The page receives no identity, cookie or upstream response. Its only script is
# pinned by the CSP hash below; the configuration loader expands $-variables,
# so the script deliberately contains no dollar sign.
#
# Generated by kailo-embed/render.py from kailo-embed/bootstrap.js; edit those.
config:
  adminAddr: 127.0.0.1:${WREN_GATEWAY_ADMIN_PORT}
binds:
  - port: ${WREN_GATEWAY_HTTP_PORT}
    listeners:
      - name: wren-native-browser
        protocol: HTTP
        routes:
          - name: kailo-embed-page
            matches:
              - path:
                  pathPrefix: /kailo-embed/
            policies:
              directResponse:
                status: 200
                headers:
                  content-type: '"text/html; charset=utf-8"'
                  cache-control: '"no-store"'
                  x-content-type-options: '"nosniff"'
                  referrer-policy: '"strict-origin-when-cross-origin"'
                  content-security-policy: '"default-src ''none''; script-src ''sha256-mrEO4wD7egxL1CBjP08j+Je0m+Yax9ysVTn5HQXmNZA=''; style-src ''unsafe-inline''; frame-src ''self'' ${WREN_OIDC_ISSUER}/; base-uri ''none''; form-action ''none''; frame-ancestors ''self'' ${KAILO_FRAME_ANCESTORS}"'
                body: |
                  <!doctype html>
                  <html lang="zh-CN">
                  <head>
                  <meta charset="utf-8">
                  <meta name="viewport" content="width=device-width,initial-scale=1">
                  <meta name="kailo-web-origin" content="${KAILO_FRAME_ANCESTORS}">
                  <meta name="kailo-logout-url" content="${KAILO_LOGOUT_URL}">
                  <title></title>
                  <style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:14px/1.6 var(--kailo-font-sans,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif);color:#4b5563;background:transparent}#m{display:none;text-align:center;padding:24px}#l{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:6px;background:#111827;color:#fff;text-decoration:none}html[data-kailo-theme=dark] body{color:#d1d5db;background:#1f2328}html[data-kailo-theme=dark] #l{background:#f3f4f6;color:#111827}</style>
                  </head>
                  <body>
                  <div id="m"><div id="t"></div><a id="l" target="_top" href="/"></a></div>
                  <script>
                  (function () {
                    var page = location.pathname;
                    var query = new URLSearchParams(location.search);
                    var meta = function (name) {
                      var node = document.querySelector('meta[name="' + name + '"]');
                      return node ? node.getAttribute('content') || '' : '';
                    };
                    var origins = meta('kailo-web-origin').split(/\s+/).filter(function (value) {
                      try {
                        var url = new URL(value);
                        return (url.protocol === 'https:' || url.protocol === 'http:') && url.origin === value;
                      } catch (error) {
                        return false;
                      }
                    });
                    var embedded = window.top !== window.self;
                    var stored = {};
                    try {
                      stored = JSON.parse(window.sessionStorage.getItem('kailo-embed-presentation') || '{}') || {};
                    } catch (error) {}
                    var inner = function (name) {
                      try {
                        return new URL(query.get('returnTo') || '/', location.origin).searchParams.get(name);
                      } catch (error) {
                        return null;
                      }
                    };
                    var locale = query.get('kailo_locale') || inner('kailo_locale') || stored.locale || 'zh-CN';
                    var dark = (query.get('kailo_theme') || inner('kailo_theme') || stored.theme) === 'dark';
                    var english = locale === 'en';
                    document.documentElement.lang = english ? 'en' : 'zh-CN';
                    if (dark) document.documentElement.setAttribute('data-kailo-theme', 'dark');
                    var text = english
                      ? { expired: 'Your session has ended. Sign in to Kailo again to continue.', out: 'You have signed out.', back: 'Back to Kailo' }
                      : { expired: '登录状态已失效，请重新登录 Kailo 后继续。', out: '已退出登录。', back: '返回 Kailo' };
                    var local = function (value) {
                      return typeof value === 'string' && value.charAt(0) === '/' && value.charAt(1) !== '/' && !/[\\\u0000- \u007f]/.test(value) ? value : '/';
                    };
                    var post = function (type) {
                      if (!embedded) return false;
                      for (var i = 0; i < origins.length; i++) window.parent.postMessage({ source: 'kailo-embed', version: 1, type: type }, origins[i]);
                      return origins.length > 0;
                    };
                    var show = function (message, href) {
                      document.getElementById('t').textContent = message;
                      var link = document.getElementById('l');
                      if (href) {
                        link.textContent = text.back;
                        link.setAttribute('href', href);
                      } else {
                        link.style.display = 'none';
                      }
                      document.getElementById('m').style.display = 'block';
                    };
                    var probe = function (done) {
                      var settled = false;
                      var frame = document.createElement('iframe');
                      var finish = function (ok) {
                        if (settled) return;
                        settled = true;
                        frame.remove();
                        done(ok);
                      };
                      frame.style.display = 'none';
                      frame.addEventListener('load', function () {
                        var path = null;
                        try {
                          path = frame.contentWindow.location.pathname;
                        } catch (error) {}
                        finish(path === '/kailo-embed/auth-ok');
                      });
                      setTimeout(function () {
                        finish(false);
                      }, 15000);
                      frame.src = '/auth/login?returnTo=' + encodeURIComponent('/kailo-embed/auth-ok');
                      document.body.appendChild(frame);
                    };
                    if (page === '/kailo-embed/signin') {
                      var target = local(query.get('returnTo'));
                      if (!embedded) {
                        location.replace('/auth/login?returnTo=' + encodeURIComponent(target));
                        return;
                      }
                      probe(function (ok) {
                        if (ok) {
                          location.replace(target);
                          return;
                        }
                        // V-SCN-226: once Kailo has the request it alone prompts; the frame stays
                        // blank. Only when no Kailo origin is configured does the page explain itself.
                        if (!post('auth-required')) show(text.expired, null);
                      });
                    } else if (page === '/kailo-embed/signed-out') {
                      var logout = meta('kailo-logout-url');
                      if (!embedded && logout) {
                        location.replace(logout);
                        return;
                      }
                      show(text.out, embedded ? null : origins[0] ? origins[0] + '/' : null);
                    }
                  })();
                  </script>
                  </body>
                  </html>
          - name: native-ui
            matches:
              - path:
                  pathPrefix: /
            policies:
              oidc:
                issuer: ${WREN_OIDC_ISSUER}
                clientId: ${WREN_OIDC_CLIENT_ID}
                clientSecret: ${WREN_OIDC_CLIENT_SECRET}
                redirectURI: ${WREN_OIDC_REDIRECT_URI}
                # DD-133 §3: display name, avatar, e-mail and locale come from
                # the same IdP claims on every login.
                scopes: [profile, email]
                login:
                  path: /auth/login
                  redirect: /kailo-embed/signin
                logout:
                  path: /auth/logout
                  redirect: /kailo-embed/signed-out
                # DD-133(6): register <public origin>/oauth/backchannel-logout
                # as this client's back-channel logout URL (session required).
                backchannelLogout:
                  path: /oauth/backchannel-logout
              # Browser credentials and platform identity headers never reach
              # the native UI. This runs on the route, after the OIDC policy
              # above has read its own transaction and session cookies: listener
              # policies run before route policies, so stripping Cookie there
              # leaves the route OIDC without them ("missing transaction").
              transformations:
                request:
                  remove:
                    - authorization
                    - cookie
                    - proxy-authorization
                    - x-platform-oidc-issuer
                    - x-platform-oidc-subject
                    - x-platform-tenant
                    - x-platform-workspace
                    - x-platform-principal
              # The pinned Gateway exposes CSRF on routes, not listener policy.
              # This catch-all covers every native UI write with no extra origin.
              csrf: {}
              backendAuth:
                passthrough: {}
            backends:
              - host: ${WREN_UI_UPSTREAM}
