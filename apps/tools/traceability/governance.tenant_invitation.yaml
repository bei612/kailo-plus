capability_id: governance.tenant_invitation
title: Tenant 成员邀请的签发、撤回、兑换、admin 确认与开通，已撤权成员的恢复
stage: S2
status: in_progress
exposure: end_user

design:
  requirements: [V-REQ-03]
  decisions: [DD-83, DD-82, DD-47, DD-54]
  facts: [SF-AGW-17, SF-AGW-22]
  seams: []
  blockers: []
  entities: [TenantInvitation, TenantMembership, HumanIdentity, ExternalIdentity, Principal, ActionDefinition, ApprovalPolicy, ActionDecision, ActionExecution, ApprovalProjection]

validation:
  scenarios: [V-SCN-67, V-SCN-07]
  evidence:
    - dimension: 端到端场景
      ref: core/verify/tenant-invitation.md
    - dimension: 安全边界
      ref: core/verify/tenant-invitation.md
    - dimension: 运维手册
      ref: docs/runbooks/RB-01-invariant-check-failure.md
    - dimension: 呈现
      ref: upstream-patches/buzz-web/verify/web-surface.md
    - dimension: 呈现
      ref: upstream-patches/buzz-desktop/verify/kailo-desktop.md

implementation:
