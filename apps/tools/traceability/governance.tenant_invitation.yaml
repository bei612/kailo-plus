  paths: [core/crates/kailo-core/src/invitation.rs, core/crates/kailo-core/src/external_human.rs, core/crates/kailo-core/src/governance.rs, core/crates/kailo-core/src/tenant_bootstrap.rs, core/crates/kailo-core/src/bff.rs, web/packages/platform/src/react/invitations.tsx, upstream-patches/buzz-web/patches/0006-tenant-invitations.patch, upstream-patches/buzz-desktop]
  # 邀请管理与兑换进度是共用包 web/packages/platform 的同一份组件（Web 与 Desktop）；
  # 兑换页在浏览器入口（/app/invite），Desktop 尚非成员时显示本人的兑换进度
  surfaces: [web, desktop]
  schemas: [contracts/api/action_command.schema.json, contracts/api/action_submission.schema.json, contracts/api/issued_invitation.schema.json, contracts/api/invitation_redemption_request.schema.json, contracts/api/invitation_redemption.schema.json, contracts/api/tenant_invitation.schema.json, contracts/enums/tenant_invitation_status.schema.json, contracts/enums/reason_code.schema.json]
  migrations: [core/migrations/20260926100000_tenant_invitation.up.sql]

runtime:
  routes: ["/api/v1/actions", "/api/v1/invitations", "/api/v1/invitations/redeem", "/api/v1/invitations/redemptions"]
  actions: [tenant.member.invite, tenant.member.invite.revoke, tenant.member.admit]
  workflow_kinds: [MEMBERSHIP_PROJECTION]

