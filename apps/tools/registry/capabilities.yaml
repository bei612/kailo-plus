# 生成物，不手工编辑。由 tools/gen-registry.py 从 tools/traceability/ 生成。
capabilities:
- id: collab.channel.media
  exposure: end_user
  routes:
  - /api/v1/workspaces/{workspace_id}/media
  - /api/v1/workspaces/{workspace_id}/media/{sha256}
  actions: []
  tools: []
  workflow_kinds: []
- id: collab.channel.message
  exposure: end_user
  routes:
  - /api/v1/workspaces/{workspace_id}/messages
  - /api/v1/workspaces/{workspace_id}/stream
  actions:
  - workspace.message.publish
  tools: []
  workflow_kinds: []
- id: collab.user_state
  exposure: end_user
  routes:
  - /api/v1/user-state
  - /api/v1/user-state/workspaces/{workspace_id}
  - /api/v1/user-state/read
  actions: []
  tools: []
  workflow_kinds: []
- id: governance.action_admission
  exposure: end_user
  routes:
  - /api/v1/actions
  - /api/v1/tasks
  - /api/v1/tasks/{action_execution_id}
  - /api/v1/approvals
  - /api/v1/approvals/{workflow_id}
  - /api/v1/approvals/{workflow_id}/decision
  - /api/v1/approvals/{workflow_id}/withdraw
  actions:
  - workspace.create
  - workspace.member.add
  - workspace.member.revoke
  - tenant.member.revoke
  - identity.client_key.register
  - identity.client_key.revoke
  - task.cancel.workspace.create.v1
  - task.cancel.workspace.member.add.v1
  - task.cancel.workspace.member.revoke.v1
  - task.cancel.tenant.member.revoke.v1
  tools: []
  workflow_kinds:
  - WORKSPACE_LIFECYCLE
  - MEMBERSHIP_PROJECTION
  - MEMBERSHIP_REVOCATION
  - BUZZ_IDENTITY_PROJECTION
- id: governance.role_management
  exposure: end_user
  routes:
  - /api/v1/actions
  - /api/v1/role-members
  - /api/v1/role-workspaces
  actions:
  - tenant.admin.grant
  - tenant.admin.revoke
  - workspace.admin.grant
  - workspace.admin.revoke
  tools: []
  workflow_kinds:
  - MEMBERSHIP_REVOCATION
- id: governance.tenant_invitation
  exposure: end_user
  routes:
  - /api/v1/actions
  - /api/v1/invitations
  - /api/v1/invitations/redeem
  - /api/v1/invitations/redemptions
  actions:
  - tenant.member.invite
  - tenant.member.invite.revoke
  - tenant.member.admit
  tools: []
  workflow_kinds:
  - MEMBERSHIP_PROJECTION
- id: identity.client_keys
  exposure: end_user
  routes:
  - /api/v1/identity/client-keys
  - /api/v1/identity/client-keys/{pubkey}
  - /api/v1/native/community
  actions: []
  tools: []
  workflow_kinds:
  - BUZZ_IDENTITY_PROJECTION
- id: lifecycle.tenant_workspace_membership
  exposure: internal
  routes: []
  actions: []
  tools: []
  workflow_kinds:
  - TENANT_LIFECYCLE
  - WORKSPACE_LIFECYCLE
  - MEMBERSHIP_PROJECTION
  - MEMBERSHIP_REVOCATION
- id: platform.pages
  exposure: end_user
  routes:
  - /app/
  - /api/v1/workspaces
  - /api/v1/workspaces/{workspace_id}/members
  - /api/v1/audit
  actions: []
  tools: []
  workflow_kinds: []
- id: platform.session
  exposure: end_user
  routes:
  - /app/
  - /api/v1/session
  - /api/v1/logout
  actions: []
  tools: []
  workflow_kinds: []
