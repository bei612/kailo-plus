# BFF 请求与回应的类型取自 contracts 的 TypeScript 生成物（ADR-02/03）；BFF 客户端、成员/邀请/
# 审计/设备/任务/审批页、邀请兑换页与文案取自 Kailo 自有的共用包 web/packages/platform——Desktop
# 用的是同一份（ADR-09）。构建时放进树；树里不带副本（web/.gitignore 忽略这些目标），这些源改了
# 就必须重建。
vendor_files:
  - web/packages/contracts/src/generated/contracts.ts:web/src/platform/contracts.gen.ts
  - web/packages/platform/src/transport.ts:web/src/kailo-platform/transport.ts
  - web/packages/platform/src/client.ts:web/src/kailo-platform/client.ts
  - web/packages/platform/src/web-fetch.ts:web/src/kailo-platform/web-fetch.ts
