upstream_url: https://github.com/hardy4yooz/buzz-web.git

# .design/02 §1 固定基线。三端各有自己的上游主体（DD-74）：Web 是 buzz-web，Desktop 与
# Mobile 分别是 block/buzz 的 desktop/（Tauri）与 mobile/（Dart），见 upstream/buzz。
# 这个上游必须改：SS-WEB-RELAY 要求整体移除浏览器直连 Relay 与本地 signer，SS-WEB-01 要求在
# 构建期静态 route/navigation 里加入平台页面，两者都不是配置能表达的。
