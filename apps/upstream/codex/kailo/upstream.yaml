# 来源记录，格式见 apps/06-工程基线规范.md §2。字段含义冲突时以该节为准。
# 本目录之外的整棵树是上游固定 commit 的完整源码，Kailo 的改动直接在树里；与上游原样的差异由
# `tools/upstream_manifest.py diff <项目>` 给出（kailo/ 是 Kailo 自有目录，不在其中）。
project: codex
upstream_url: https://github.com/openai/codex

# .design/02 §1 固定基线（Codex 行）。SF-COD-*/SS-COD-* 全部以该 commit 为证据。
evidence_commit: 7498521d288b9b3b96ffba4eedf089d8d6e06a84
implementation_base_commit: 7498521d288b9b3b96ffba4eedf089d8d6e06a84
base_divergence: none

# SS-COD-TRACE：模型请求的 header 只合并静态 http_headers 与 env_http_headers，上游不在该链上
# 注入 W3C trace context。Kailo 在 codex-rs/model-provider-info/src/lib.rs::
# ModelProviderInfo::build_header_map 末尾以 codex_otel::inject_span_w3c_trace_headers(Span::current())
# 注入 traceparent/tracestate；当前 span 是 turn 下的模型请求 span，其根的 parent 是 Core 在
# JSON-RPC 请求 `trace` 字段里带来的 operation trace（app-server/src/app_server_tracing.rs::
# attach_parent_context → core/src/session/handlers.rs::submission_dispatch_span）。只有配置了
# [otel] trace_exporter 时 span 才有 OTel context，否则不注入（见 kailo/verify）。
#
# SS-COD-RUNTIME/SS-COD-APP 只靠配置：固定配置在 kailo/codex/，由 kailo/packaging/Dockerfile
# 装入镜像（逐项源码证据见 kailo/verify/trace-and-runtime-config.md）。

artifacts:
  # 上游没有 app-server 的运行镜像 Dockerfile，由 Kailo 维护。产物是镜像；尚未构建登记。
  - name: upstream-codex
    kind: image
    build_context: .
    build_dockerfile: kailo/packaging/Dockerfile
    source_digest: none
    artifact_digest: none

source_facts: [SF-COD-01, SF-COD-03, SF-COD-04, SF-COD-10, SF-COD-11, SF-COD-12, SF-COD-15]
source_seams: [SS-COD-TRACE, SS-COD-RUNTIME, SS-COD-APP]
compatibility_evidence: [upstream/codex/kailo/verify/trace-and-runtime-config.md]
