# 与 agentgateway 不同，这个上游**必须改**：SS-WEB-RELAY 要求整体移除浏览器
# 直连 Relay 与本地 signer，SS-WEB-01 要求在构建期静态 route/navigation 里
# 加入平台页面。两者都不是配置能表达的，因此有真实的 patch series。
#
# 改动以 patch series 形式保存而不是把 130 个源文件搬进本仓库：上游仍在演进，
# 搬进来之后每次升级都变成手工比对，而 patch 能在新 commit 上直接重放并暴露冲突。
patch_series: [0001-bff-transport-and-platform-pages.patch, 0002-stream-reopen-after-http-error.patch, 0003-platform-contracts-generated-types.patch, 0004-shared-platform-package.patch]
# BFF 请求与回应的类型取自 contracts 的 TypeScript 生成物（ADR-02/03）；BFF 客户端、
# 成员/审计/设备页与文案取自 Kailo 自有的共用包 web/packages/platform——Desktop 用的是
# 同一份（ADR-09）。补丁只 import 它们，构建时从本仓库放进源树；补丁里不带副本，
# 这些源改了就必须重建。
vendor_files:
