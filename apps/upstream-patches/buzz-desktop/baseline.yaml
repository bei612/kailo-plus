# 格式见 apps/06-工程基线规范.md §2。字段含义冲突时以该节为准。
project: buzz-desktop
upstream_url: https://github.com/block/buzz

# Buzz Desktop 的受控上游是 block/buzz 仓库的 desktop/（Tauri），与 Buzz Web 的
# buzz-web 不是同一代码库（DD-74）。它与 Relay 同在一个 monorepo，因此 commit 与
# buzz 的基线相同。
evidence_commit: 779af8886caae1317b4de962082429867ab61503
implementation_base_commit: 779af8886caae1317b4de962082429867ab61503
base_divergence: none

# 源树由 tools/upstream_manifest.py export 从开发中的上游工作树（block/buzz 的 kailo 分支）
# 导出：一期不交付而整块删除的上游代码（Agent、Workflow、Huddle、Projects、DM、Terminal、
# 发布链路与 sidecar 等，见 verify/baseline-build.md 与 verify/kailo-desktop.md）只登记路径；
# 其余改动（Kailo 登录引导、平台页入口、Rust 侧 Kailo 层、裁剪后的连带修改）是一份补丁。
