include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  errors:
    invalid_use_of_visible_for_overriding_member: ignore
  exclude:
    - build/**
    # 由 Kailo 的 tools/gen.sh 从 contracts/ 生成，不手工编辑
    - lib/shared/contracts/generated/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
