# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# AgentGateway 作为 Browser 侧的 OIDC PEP（SS-AGW-OIDC、DD-02）。
#
# 它只做两件事：验证 OIDC 会话，把已验证的 issuer 与 subject 投影成两条固定
# 的内网 header。BFF 只信任这两条 header，缺任一条即拒绝——fail closed。
#
# 四条来自 SS-AGW-OIDC 的硬约束，改动前先读该接缝：
#   1. OIDC 在 route transformation 之前运行，因此 transformation 可读 jwt.*
#   2. 只用两条 set 投影固定 issuer 与 subject，二者不得进入 remove 列表
#   3. 其它 x-kailo-* 身份 header 先移除——Browser 自报的一律不可信
#   4. set 求值失败会删除目标 header；BFF 以缺失即拒绝保持 fail closed
#
# 禁止投影 raw token 与任何角色 claim：授权在 Core 重做，网关不是授权权威。

binds:
- port: 8080
  listeners:
  - name: browser
    protocol: HTTP

    # 认证与身份投影挂在 **listener** 上，不挂在各条 route 上。
    #
    # 两个理由，都不是风格问题：
    #
    # 其一，会话必须只有一份。inline route policy 的 OIDC 取
    # `PolicyId::route(<route key>)`，cookie 名是该 id 的 sha256 前 8 字节
    # （`derive_cookie_names`）。每条 route 各挂一份 OIDC 就各有一套
    # session/transaction cookie，于是在 `/app` 发起的登录跳到
    # `/oauth/callback` 时落到另一条 route 的 policy 上，找不到自己那笔
    # transaction——登录根本走不完。listener 级只产生一个
    # `listener/<key>` policy id，因而只有一份会话。
    #
    # 其二，投影必须无法被新增 route 绕开。gateway 阶段的策略在
    # `select_route_chain` **之前**执行（`apply_gateway_policies` 的调用点），
    # 顺序是 CORS → OIDC → … → transformation。因此任何将来加进这个
    # listener 的 route 都已经过完认证与 header 清洗，不存在「新加一条
    # route 忘了抄 remove 列表」这种失败方式。
    #
    # 证据：SF-AGW-22。
    policies:
      oidc:
        issuer: ${OIDC_ISSUER}
        clientId: ${OIDC_BROWSER_CLIENT_ID}
        clientSecret: ${OIDC_BROWSER_CLIENT_SECRET}
        redirectURI: ${OIDC_REDIRECT_URI}
        scopes:
        - profile
        - email
        # 本地 logout 是可选的：省略它，POST /logout 会被当作普通请求转给
        # BFF（404），网关 cookie 原样留着——点了「退出」而会话仍在，下一个
        # 请求就在 Core 里建起一条新会话（SF-AGW-23）。
        #
        # 落点只能是本地路径，而 listener 级 OIDC 之下没有公开页可落：浏览器
        # 会经 IdP 重新走一次登录。IdP 自身的会话还在时，这一次不会要求口令
        # ——那是 IdP 的会话，不是 Kailo 的；Kailo 一侧的 PlatformSession 与
        # 网关 cookie 都已失效，重新进入是一次新的登录、新的会话（.design/09）。
        logout:
          path: /logout
          redirect: /app/
      transformations:
        request:
          # 移除 Browser 可能自报的身份 header。
          #
          # `proxy-authorization` 必须在列：AgentGateway 故意不把它当作
          # hop-by-hop header 清理，好让 forward-proxy 的认证策略读到它
          # （SF-AGW-20）。反向代理 route 因此会把调用方提交的代理凭据原样
          # 转给 upstream。DD-73 要求 Kailo 的每条 route 在 dispatch 前
          # 无条件删除它——这里是那条要求的唯一执行点。
          #
          # 两个投影目标 x-kailo-oidc-issuer / x-kailo-oidc-subject 刻意
          # 不在此列表中——接缝明确禁止。它们由下面的 set 无条件覆盖，
          # 而 CEL 求值得不到值时 apply_header 走 (Header(k), None) 分支
          # 直接删除该 header。因此 set 本身已保证「要么是已验证的值，
          # 要么不存在」；再列进 remove 只会引入删掉正确值的风险。
          #
          # x-kailo-client-surface 只由原生 listener 投影（DD-78）。浏览器能
          # 自报它，就能打开只对原生端开放的入口（设备公钥登记）。
          remove:
          - proxy-authorization
          - x-kailo-human-identity
          - x-kailo-tenant
          - x-kailo-workspace
          - x-kailo-principal
          - x-kailo-client-surface
          set:
            x-kailo-oidc-issuer: jwt.iss
            x-kailo-oidc-subject: jwt.sub

    routes:
    # Web 面。镜像里的 Caddy 只 handle `/app*`，其余一律 404，因此前缀
    # 与镜像的服务范围是同一件事，不是任取的挂载点。
    #
    # 这条 route 排在 bff 之前只是为了读起来顺；选路不看书写顺序：
    # RouteSet 按「Exact > PathPrefix > Regex，同类型长者优先」预排序
    # （`RouteSet::compare_route`），`/app` 因此稳定压过 `/`（SF-AGW-22）。
    - name: web
      matches:
      - path:
          pathPrefix: /app
      backends:
      - host: ${WEB_UPSTREAM}

    # 其余全部归 BFF：`/api/v1/*` 的平台面，以及 OIDC 自己的
    # `/oauth/callback`（它由 listener 级 policy 短路处理，不会真打到 BFF）。
    - name: bff
      matches:
      - path:
          pathPrefix: /
      backends:
      - host: ${BFF_UPSTREAM}

# 原生端入口（DD-78）：Desktop/Mobile 按 RFC 8252 以授权码 + PKCE 取得访问令牌，
# 以 Bearer 调用。与浏览器入口是两个 bind 而不是同一 listener 上的两套认证：
# gateway 阶段的 OIDC 会先于 jwtAuth 处理每个请求，把不带 cookie 的原生请求当成
# 未登录的浏览器导航（SF-AGW-22）。
- port: 8091
  listeners:
  - name: native
    protocol: HTTP
    policies:
      # 上游缺省 mode=optional：不带令牌的请求直接放行；省略 audiences 即关闭
      # audience 校验；保留令牌会把用户凭据转给 BFF（SF-AGW-24、SF-AGW-11/19）。
      # 三项都显式写死在这里，并由 tools/check.sh 核对。
      jwtAuth:
        mode: strict
        issuer: ${OIDC_ISSUER}
        audiences:
        - ${OIDC_NATIVE_AUDIENCE}
        preserveToken: false
        jwks:
          url: ${OIDC_JWKS_URI}
      transformations:
        request:
          # 与浏览器入口相同的清洗与投影，另外声明请求来自原生端。set 无条件
          # 覆盖，客户端自报的同名 header 不会留下来。
          remove:
          - proxy-authorization
          - x-kailo-human-identity
          - x-kailo-tenant
          - x-kailo-workspace
          - x-kailo-principal
          set:
            x-kailo-oidc-issuer: jwt.iss
            x-kailo-oidc-subject: jwt.sub
            x-kailo-client-surface: '"native"'
    routes:
    # 原生端只有管理平面经 BFF（DD-75）；Web 静态资源与 OIDC 回调都不在这里
    - name: bff-native
      matches:
      - path:
          pathPrefix: /api/
      backends:
      - host: ${BFF_UPSTREAM}

