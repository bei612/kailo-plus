[package]
name = "kailo-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
contracts = { path = "../contracts" }
kailo-identity = { path = "../kailo-identity" }
kailo-buzz = { path = "../kailo-buzz" }
kailo-secrets = { path = "../kailo-secrets" }
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
futures-util = "0.3"
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "macros", "json", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
hex = "0.4"
jsonwebtoken = "9"
nostr = { version = "0.44", default-features = false, features = ["std"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
temporalio-client = { version = "1.0.0", features = ["vendored-protox"] }
temporalio-common = { version = "1.0.0", features = ["vendored-protox"] }
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }

[dev-dependencies]
base64 = "0.22"
futures-util = "0.3"
nostr = { version = "0.44", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
