[package]
name = "kailo-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
contracts = { path = "../contracts" }
kailo-identity = { path = "../kailo-identity" }
kailo-buzz = { path = "../kailo-buzz" }
kailo-secrets = { path = "../kailo-secrets" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "macros"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
temporalio-client = { version = "1.0.0", features = ["vendored-protox"] }
temporalio-common = { version = "1.0.0", features = ["vendored-protox"] }

[dev-dependencies]
futures-util = "0.3"
nostr = { version = "0.44", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
