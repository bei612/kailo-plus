# SS-COD-TRACE：模型请求的 header 只合并静态 http_headers 与 env_http_headers，上游不在该链上
# 注入 W3C trace context。平台在 codex-rs/model-provider-info/src/lib.rs::
# ModelProviderInfo::build_header_map 末尾以 codex_otel::inject_span_w3c_trace_headers(Span::current())
# 注入 traceparent/tracestate；当前 span 是 turn 下的模型请求 span，其根的 parent 是 Core 在
# JSON-RPC 请求 `trace` 字段里带来的 operation trace（app-server/src/app_server_tracing.rs::
# attach_parent_context → core/src/session/handlers.rs::submission_dispatch_span）。只有配置了
# [otel] trace_exporter 时 span 才有 OTel context，否则不注入（见 fork/verify）。
#
# SS-COD-RUNTIME/SS-COD-APP 只靠配置：固定配置在 fork/runtime-config/，由 fork/packaging/Dockerfile
# 装入镜像（逐项源码证据见 fork/verify/trace-and-runtime-config.md）。

artifacts:
  # 上游没有 app-server 的运行镜像 Dockerfile，由本仓库维护。产物是镜像。
  - name: agent-runtime
    kind: image
    build_context: agent-runtime
    build_dockerfile: agent-runtime/fork/packaging/Dockerfile
    build_args: [CARGO_BUILD_JOBS]
    inputs: [agent-runtime/]
